<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial CGI — Concept C: Director's Screening Room</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@100;200;300;400&family=Barlow:wght@300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020208;
  --seat:#0a0914;
  --screen-bg:#0f0e1c;
  --ink:#f2f0ff;
  --ink-mute:rgba(242,240,255,0.48);
  --ink-ghost:rgba(242,240,255,0.12);
  --accent:#f7c5a0;
  --f-display:'Barlow Condensed',sans-serif;
  --f-body:'Barlow',sans-serif;
  --f-mono:'DM Mono',monospace;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow-x:hidden;cursor:none}

/* Cursor */
#cursor{position:fixed;z-index:9999;pointer-events:none;top:0;left:0}
.c-dot{width:6px;height:6px;background:var(--ink);border-radius:50%;transform:translate(-50%,-50%)}
.c-ring{position:absolute;top:0;left:0;width:36px;height:36px;border:1px solid rgba(247,197,160,0.4);border-radius:50%;transform:translate(-50%,-50%);transition:width 0.25s,height 0.25s,border-color 0.25s}
body:has(.reel-item:hover) .c-ring,.playing .c-ring{width:52px;height:52px;border-color:var(--accent)}

/* Header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;padding:2rem 3rem;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.hdr a,.hdr span{pointer-events:all}
.hdr-l{font-family:var(--f-mono);font-size:0.6rem;letter-spacing:0.3em;color:var(--ink-mute);text-decoration:none}
.hdr-r{font-family:var(--f-mono);font-size:0.6rem;letter-spacing:0.2em;color:var(--ink-ghost)}
.hdr-r span{color:var(--accent)}

/* ── SCREENING ROOM LAYOUT ── */
.room{display:flex;flex-direction:column;min-height:100vh;padding-top:80px}

/* Stage — large featured film */
.stage{position:relative;background:var(--screen-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:75vh}
.stage-spotlight{position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 40%,rgba(30,25,60,0.0) 0%,rgba(2,2,8,0.7) 100%);pointer-events:none;z-index:2}
.stage-film{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:2rem 0}
#featured-vid{height:72vh;max-height:82vh;aspect-ratio:9/16;object-fit:cover;display:block;position:relative;z-index:1}
.stage-curtain-l,.stage-curtain-r{position:absolute;top:0;bottom:0;width:8%;z-index:3;pointer-events:none}
.stage-curtain-l{left:0;background:linear-gradient(to right,rgba(2,2,8,0.9),transparent)}
.stage-curtain-r{right:0;background:linear-gradient(to left,rgba(2,2,8,0.9),transparent)}
.stage-floor{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(to top,var(--seat),transparent);z-index:4;pointer-events:none}

/* Stage info overlay */
.stage-info{position:absolute;bottom:0;left:0;right:0;z-index:5;padding:2.5rem 3rem;display:flex;justify-content:space-between;align-items:flex-end}
.stage-meta{max-width:400px}
.stage-eyebrow{font-family:var(--f-mono);font-size:0.55rem;letter-spacing:0.35em;color:var(--accent);margin-bottom:0.7rem;display:block}
.stage-title{font-family:var(--f-display);font-weight:200;font-size:clamp(2.5rem,5vw,5rem);letter-spacing:-0.01em;line-height:0.95}
.stage-controls{display:flex;gap:0.8rem;align-items:center}
.ctrl-btn{background:none;border:1px solid var(--ink-ghost);color:var(--ink);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:none;transition:border-color 0.2s,background 0.2s;font-size:0.7rem}
.ctrl-btn:hover{border-color:var(--accent);background:rgba(247,197,160,0.08)}
.ctrl-btn.primary{border-color:var(--accent);background:rgba(247,197,160,0.1);width:54px;height:54px}

/* Progress bar */
.stage-progress{position:absolute;bottom:0;left:0;right:0;height:2px;z-index:6;background:var(--ink-ghost)}
.stage-progress-fill{height:100%;background:var(--accent);width:0%;transition:width 0.1s linear}

/* ── REEL STRIP ── */
.reel-strip{background:var(--seat);padding:2rem 3rem;position:relative;z-index:10}
.reel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.reel-label{font-family:var(--f-mono);font-size:0.6rem;letter-spacing:0.3em;color:var(--ink-mute)}
.reel-counter{font-family:var(--f-mono);font-size:0.6rem;letter-spacing:0.2em;color:var(--accent)}

/* Horizontal filmstrip */
.reel-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.reel-scroll::-webkit-scrollbar{display:none}
.reel-item{flex-shrink:0;position:relative;width:80px;aspect-ratio:9/16;overflow:hidden;cursor:none;transition:transform 0.3s ease,box-shadow 0.3s ease}
.reel-item video{width:100%;height:100%;object-fit:cover;filter:brightness(0.4) saturate(0.5);transition:filter 0.4s}
.reel-item:hover video,.reel-item.active video{filter:brightness(0.75) saturate(0.9)}
.reel-item.active{box-shadow:0 0 0 2px var(--accent)}
.reel-item:hover{transform:scaleY(1.06)}
.reel-num{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:0.45rem;letter-spacing:0.15em;color:var(--ink-mute);pointer-events:none}
/* Sprocket holes */
.reel-item::before,.reel-item::after{content:'';position:absolute;top:8px;bottom:8px;width:6px;background:repeating-linear-gradient(to bottom,var(--bg) 0px,var(--bg) 8px,transparent 8px,transparent 12px);z-index:2;pointer-events:none}
.reel-item::before{left:0}
.reel-item::after{right:0}

/* ── CREDITS SECTION ── */
.credits{padding:5rem 3rem 8rem;border-top:1px solid var(--ink-ghost)}
.credits-heading{font-family:var(--f-display);font-weight:100;font-size:clamp(2rem,4vw,4rem);letter-spacing:-0.01em;margin-bottom:3rem;color:var(--ink-mute)}
.credits-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px}
.credit-row{padding:1.2rem;border:1px solid var(--ink-ghost);display:flex;justify-content:space-between;align-items:center;transition:background 0.2s}
.credit-row:hover{background:rgba(247,197,160,0.04)}
.cr-name{font-family:var(--f-display);font-weight:300;font-size:1rem;letter-spacing:0.04em}
.cr-role{font-family:var(--f-mono);font-size:0.52rem;letter-spacing:0.22em;color:var(--ink-mute)}
.cr-play{width:28px;height:28px;border:1px solid var(--ink-ghost);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:none;transition:border-color 0.2s}
.cr-play:hover{border-color:var(--accent)}
.cr-play svg{width:8px;height:8px;fill:var(--ink);margin-left:2px}

.section-footer{padding:3rem;border-top:1px solid var(--ink-ghost);display:flex;justify-content:space-between;align-items:center}
.sf-back{font-family:var(--f-mono);font-size:0.6rem;letter-spacing:0.28em;color:var(--ink-mute);text-decoration:none;transition:color 0.2s}
.sf-back:hover{color:var(--accent)}
.sf-label{font-family:var(--f-mono);font-size:0.58rem;letter-spacing:0.2em;color:var(--ink-ghost)}

@media(max-width:768px){
  .hdr{padding:1.5rem}
  .stage-info{padding:1.5rem}
  .stage-title{font-size:2rem}
  .reel-strip,.credits,.section-footer{padding-left:1.5rem;padding-right:1.5rem}
  #featured-vid{height:52vh}
}
</style>
</head>
<body>
<div id="cursor"><div class="c-dot"></div><div class="c-ring"></div></div>

<header class="hdr">
  <a href="concepts-index.html" class="hdr-l">← Back</a>
  <span class="hdr-r">Concept <span>C</span> — Director's Screening Room</span>
</header>

<div class="room">
  <!-- Main stage -->
  <div class="stage">
    <div class="stage-curtain-l"></div>
    <div class="stage-curtain-r"></div>
    <div class="stage-film">
      <video id="featured-vid" autoplay muted loop playsinline></video>
    </div>
    <div class="stage-spotlight"></div>
    <div class="stage-floor"></div>
    <div class="stage-info">
      <div class="stage-meta">
        <span class="stage-eyebrow" id="feat-eyebrow">No.01 / 11</span>
        <h2 class="stage-title" id="feat-title">Chocolate Bar</h2>
      </div>
      <div class="stage-controls">
        <button class="ctrl-btn" id="btn-prev" title="Previous">‹</button>
        <button class="ctrl-btn primary" id="btn-play" title="Play/Pause">▶</button>
        <button class="ctrl-btn" id="btn-next" title="Next">›</button>
        <button class="ctrl-btn" id="btn-mute" title="Mute/Unmute">🔇</button>
      </div>
    </div>
    <div class="stage-progress"><div class="stage-progress-fill" id="progress-fill"></div></div>
  </div>

  <!-- Reel strip -->
  <div class="reel-strip">
    <div class="reel-header">
      <span class="reel-label">In the Can — 11 Films</span>
      <span class="reel-counter" id="reel-count">01 / 11</span>
    </div>
    <div class="reel-scroll" id="reel-scroll"></div>
  </div>

  <!-- Credits list -->
  <div class="credits">
    <h2 class="credits-heading">Production<br>Credits</h2>
    <div class="credits-grid" id="credits-grid"></div>
  </div>

  <footer class="section-footer">
    <a href="concepts-index.html" class="sf-back">← All Concepts</a>
    <span class="sf-label">Concept C · Director's Screening Room · Commercial CGI</span>
  </footer>
</div>

<script>
const CDN = 'https://pub-88341f47988743aba3154d2af5c6327e.r2.dev';
const FILMS = [
  {src:'gallery/ads/chocolate-bar.mp4',name:'Chocolate Bar',cat:'Product · CGI'},
  {src:'gallery/ads/earbuds.mp4',name:'Earbuds',cat:'Consumer Electronics'},
  {src:'gallery/ads/facewash.mp4',name:'Face Wash',cat:'Beauty · Skincare'},
  {src:'gallery/ads/pepsi.mp4',name:'Pepsi',cat:'Beverage · FMCG'},
  {src:'gallery/ads/serum.mp4',name:'Serum',cat:'Beauty · Luxury'},
  {src:'gallery/ads/shoe.mp4',name:'Shoe',cat:'Fashion · CGI'},
  {src:'gallery/ads/smart-watch.mp4',name:'Smart Watch',cat:'Consumer Tech'},
  {src:'gallery/ads/911%20Commercial.mp4',name:'911 Commercial',cat:'Automotive'},
  {src:'gallery/ads/Moisturizer%20and%20Cleanser%20Ad-1.mp4',name:'Moisturizer & Cleanser',cat:'Skincare'},
  {src:'gallery/ads/RR%20Ad.mp4',name:'RR Ad',cat:'Luxury'},
  {src:'gallery/ads/Reelvideo-29689.mp4',name:'Showreel',cat:'Compilation'},
];

// Cursor
const cdot=document.querySelector('.c-dot'),cring=document.querySelector('.c-ring');
let mx=0,my=0,tx=0,ty=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cdot.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`});
(function a(){tx+=(mx-tx)*0.1;ty+=(my-ty)*0.1;cring.style.transform=`translate(${tx}px,${ty}px) translate(-50%,-50%)`;requestAnimationFrame(a)})();

// Featured player
const fVid = document.getElementById('featured-vid');
let current = 0, muted = true;

function loadFilm(i){
  current = i;
  const f = FILMS[i];
  fVid.src = `${CDN}/${f.src}`;
  fVid.muted = muted;
  fVid.play().catch(()=>{});
  document.getElementById('feat-title').textContent = f.name;
  document.getElementById('feat-eyebrow').textContent = `No.${String(i+1).padStart(2,'0')} / ${FILMS.length}`;
  document.getElementById('reel-count').textContent = `${String(i+1).padStart(2,'0')} / ${FILMS.length}`;
  document.querySelectorAll('.reel-item').forEach((r,j)=>r.classList.toggle('active',j===i));
  // Scroll reel to show active
  const items = document.querySelectorAll('.reel-item');
  if(items[i]) items[i].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

// Progress bar
fVid.addEventListener('timeupdate',()=>{
  if(fVid.duration){
    document.getElementById('progress-fill').style.width = (fVid.currentTime/fVid.duration*100)+'%';
  }
});
fVid.addEventListener('ended',()=>loadFilm((current+1)%FILMS.length));

// Controls
document.getElementById('btn-play').addEventListener('click',()=>{
  if(fVid.paused){fVid.play();document.getElementById('btn-play').textContent='⏸'}
  else{fVid.pause();document.getElementById('btn-play').textContent='▶'}
});
document.getElementById('btn-prev').addEventListener('click',()=>loadFilm((current-1+FILMS.length)%FILMS.length));
document.getElementById('btn-next').addEventListener('click',()=>loadFilm((current+1)%FILMS.length));
document.getElementById('btn-mute').addEventListener('click',()=>{
  muted=!muted;fVid.muted=muted;
  document.getElementById('btn-mute').textContent=muted?'🔇':'🔊';
});

// Build reel strip
const reelScroll = document.getElementById('reel-scroll');
FILMS.forEach((f,i)=>{
  const item = document.createElement('div');
  item.className='reel-item'+(i===0?' active':'');
  item.innerHTML=`<video src="${CDN}/${f.src}" muted loop preload="none" playsinline></video><span class="reel-num">0${i+1}</span>`;
  const vid = item.querySelector('video');
  item.addEventListener('mouseenter',()=>vid.play().catch(()=>{}));
  item.addEventListener('mouseleave',()=>{vid.pause();vid.currentTime=0});
  item.addEventListener('click',()=>loadFilm(i));
  reelScroll.appendChild(item);
});

// Build credits grid
const creditsGrid = document.getElementById('credits-grid');
FILMS.forEach((f,i)=>{
  const row = document.createElement('div');
  row.className='credit-row';
  row.innerHTML=`<div><div class="cr-name">${f.name}</div><div class="cr-role">${f.cat}</div></div><button class="cr-play" data-i="${i}" title="Screen"><svg viewBox="0 0 10 12"><polygon points="0,0 10,6 0,12"/></svg></button>`;
  row.querySelector('.cr-play').addEventListener('click',()=>loadFilm(i));
  creditsGrid.appendChild(row);
});

// Init
loadFilm(0);

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')loadFilm((current-1+FILMS.length)%FILMS.length);
  if(e.key==='ArrowRight')loadFilm((current+1)%FILMS.length);
  if(e.key===' '){e.preventDefault();if(fVid.paused)fVid.play();else fVid.pause()}
});
</script>
</body>
</html>
