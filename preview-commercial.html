<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B1+B3 Hybrid — Commercial CGI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&family=Inter:wght@300;400&family=DM+Mono:wght@300;400&display=swap">
<style>
:root{
  --bg:#06050c;--bg-1:#0b0a14;--bg-2:#100f1c;
  --ink:rgba(255,255,255,.92);--ink-dim:rgba(255,255,255,.45);
  --ink-mute:rgba(255,255,255,.20);--ink-ghost:rgba(255,255,255,.06);
  --accent:#e8d5b0;
  --f-display:'Inter Tight',sans-serif;--f-body:'Inter',sans-serif;--f-mono:'DM Mono',monospace;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
.ads-layout{display:grid;grid-template-columns:minmax(280px,320px) 1fr;min-height:100vh;}
.index-col{
  background:var(--bg-1);border-right:1px solid var(--ink-ghost);
  padding:clamp(3rem,5vw,5rem) 2.5rem;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;scrollbar-width:none;
}
.index-col::-webkit-scrollbar{display:none}
.index-eyebrow{font-family:var(--f-mono);font-size:.65rem;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-bottom:2.5rem;}
.index-title{font-family:var(--f-display);font-weight:200;font-size:clamp(1.8rem,2.5vw,2.4rem);letter-spacing:-.03em;line-height:1.05;color:var(--ink);margin-bottom:.5rem;}
.index-sub{font-family:var(--f-mono);font-size:.65rem;letter-spacing:.14em;color:var(--ink-mute);text-transform:uppercase;margin-bottom:3rem;}
.index-list{list-style:none;flex:1;display:flex;flex-direction:column;gap:0;}
.index-item{
  display:flex;align-items:center;gap:1.2rem;
  padding:.9rem 0;border-bottom:1px solid var(--ink-ghost);
  cursor:pointer;position:relative;
}
.index-item:first-child{border-top:1px solid var(--ink-ghost)}
.index-item::before{content:'';position:absolute;left:-2.5rem;right:-2.5rem;top:0;bottom:0;background:transparent;transition:background .25s;z-index:0;}
.index-item:hover::before{background:var(--ink-ghost)}
.index-item.active::before{background:rgba(232,213,176,.06)}
.idx-num{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;color:var(--ink-mute);min-width:2ch;z-index:1;transition:color .2s;}
.index-item.active .idx-num,.index-item:hover .idx-num{color:var(--accent)}
.index-item.active .idx-num::after{content:'→';margin-left:.3rem;color:var(--accent);}
.idx-thumb{width:2.8rem;height:4.2rem;object-fit:cover;object-position:center;background:var(--bg-2);flex-shrink:0;z-index:1;border:1px solid transparent;transition:border-color .2s;}
.index-item.active .idx-thumb,.index-item:hover .idx-thumb{border-color:var(--accent)}
.idx-info{z-index:1;flex:1;min-width:0}
.idx-name{font-family:var(--f-display);font-weight:300;font-size:.88rem;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s;}
.index-item:hover .idx-name{color:var(--accent)}
.idx-meta{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;color:var(--ink-mute);text-transform:uppercase;margin-top:.2rem;}
.wall-col{padding:clamp(3rem,5vw,5rem) clamp(2rem,4vw,4rem);overflow-y:auto;}
.wall-header{display:flex;align-items:baseline;gap:2rem;margin-bottom:3rem;padding-bottom:1.5rem;border-bottom:1px solid var(--ink-ghost);}
.wall-eyebrow{font-family:var(--f-mono);font-size:.65rem;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-mute);}
.wall-count{font-family:var(--f-mono);font-size:.65rem;letter-spacing:.12em;color:var(--accent);margin-left:auto;}
.film-wall{columns:3;column-gap:1rem;}
.film-card{
  break-inside:avoid;margin-bottom:1rem;
  position:relative;cursor:pointer;
  background:var(--bg-1);overflow:hidden;
  border:1px solid var(--ink-ghost);
  transition:border-color .3s var(--ease-out),transform .4s var(--ease-out);
}
.film-card:hover{border-color:var(--ink-mute);transform:scale(1.02);}
.film-card:nth-child(1){aspect-ratio:9/16}.film-card:nth-child(2){aspect-ratio:9/14}
.film-card:nth-child(3){aspect-ratio:9/12}.film-card:nth-child(4){aspect-ratio:9/16}
.film-card:nth-child(5){aspect-ratio:9/13}.film-card:nth-child(6){aspect-ratio:9/15}
.film-card:nth-child(7){aspect-ratio:9/16}.film-card:nth-child(8){aspect-ratio:9/14}
.film-card:nth-child(9){aspect-ratio:9/12}.film-card:nth-child(10){aspect-ratio:9/16}
.film-card:nth-child(11){aspect-ratio:9/13}
.film-video{width:100%;height:100%;object-fit:contain;display:block;background:#000;}
.film-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(6,5,12,.9) 0%,transparent 45%);
  opacity:0;transition:opacity .35s var(--ease-out);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:1.2rem 1rem;pointer-events:none;
}
.film-card:hover .film-overlay{opacity:1}
.film-num{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:.3rem;}
.film-title{font-family:var(--f-display);font-weight:300;font-size:.9rem;letter-spacing:-.01em;color:var(--ink);line-height:1.2;}
.film-play{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:3rem;height:3rem;border-radius:50%;
  border:1px solid rgba(255,255,255,.4);color:rgba(255,255,255,.7);font-size:.8rem;
  display:flex;align-items:center;justify-content:center;
  background:rgba(6,5,12,.5);backdrop-filter:blur(4px);
  opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;
}
.film-card:hover .film-play{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
.focus-panel{margin-bottom:2rem;display:none;}
.focus-panel.visible{display:block}
.focus-video-wrap{position:relative;background:#000;width:100%;max-width:380px;margin:0 auto;aspect-ratio:9/16;border:1px solid var(--ink-mute);}
.focus-video{width:100%;height:100%;object-fit:contain;display:block}
.focus-close{
  position:absolute;top:.8rem;right:.8rem;
  width:2rem;height:2rem;border-radius:50%;
  background:rgba(6,5,12,.7);border:1px solid var(--ink-mute);
  color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:.8rem;
}
.focus-meta{max-width:380px;margin:1rem auto 0;text-align:center}
.focus-title{font-family:var(--f-display);font-weight:200;font-size:1.4rem;letter-spacing:-.02em;color:var(--ink);}
.focus-sub{font-family:var(--f-mono);font-size:.65rem;letter-spacing:.18em;color:var(--ink-mute);text-transform:uppercase;margin-top:.3rem;}
.reveal{opacity:0;transform:translateY(1.5rem);transition:opacity .7s var(--ease-out),transform .7s var(--ease-out)}
.reveal.visible{opacity:1;transform:none}
.preview-note{font-family:var(--f-mono);font-size:.65rem;letter-spacing:.12em;color:var(--ink-mute);text-align:center;padding:2rem;border-top:1px solid var(--ink-ghost);margin-top:3rem;}
</style>
</head>
<body>
<div class="ads-layout">
  <aside class="index-col">
    <div class="index-eyebrow">Design Preview — B1+B3 Hybrid</div>
    <h2 class="index-title">Commercial CGI.</h2>
    <div class="index-sub">11 films · Click to focus</div>
    <ul class="index-list" id="index-list"></ul>
  </aside>
  <main class="wall-col">
    <div class="wall-header reveal">
      <span class="wall-eyebrow">Kinetic Film Wall</span>
      <span class="wall-count">11 / 11 films</span>
    </div>
    <div class="focus-panel" id="focus-panel">
      <div class="focus-video-wrap">
        <video class="focus-video" id="focus-video" autoplay loop muted playsinline></video>
        <button class="focus-close" id="focus-close">✕</button>
      </div>
      <div class="focus-meta">
        <div class="focus-title" id="focus-title"></div>
        <div class="focus-sub" id="focus-sub"></div>
      </div>
    </div>
    <div class="film-wall reveal" id="film-wall" style="transition-delay:.1s"></div>
    <div class="preview-note">B1+B3 HYBRID — Masonry Film Wall + Exhibition Index · All 11 portrait films · 9:16 object-fit:contain · Hover plays · Click to focus</div>
  </main>
</div>
<script>
const CDN='https://pub-88341f47988743aba3154d2af5c6327e.r2.dev/gallery/ads/';
const FILMS=[
  {n:'01',name:'Chocolate',file:'chocolate.mp4',cat:'Product · CGI'},
  {n:'02',name:'Earbuds',file:'earbuds.mp4',cat:'Product · CGI'},
  {n:'03',name:'Face Wash',file:'facewash.mp4',cat:'Product · CGI'},
  {n:'04',name:'Pepsi',file:'pepsi.mp4',cat:'Brand · Commercial'},
  {n:'05',name:'Serum',file:'serum.mp4',cat:'Product · CGI'},
  {n:'06',name:'Shoe',file:'shoe.mp4',cat:'Product · CGI'},
  {n:'07',name:'Smart Watch',file:'smart-watch.mp4',cat:'Product · Tech'},
  {n:'08',name:'911 Commercial',file:'911%20Commercial.mp4',cat:'Automotive · CGI'},
  {n:'09',name:'Moisturizer & Cleanser',file:'Moisturizer%20and%20Cleanser%20Ad-1.mp4',cat:'Beauty · CGI'},
  {n:'10',name:'RR Ad',file:'RR%20Ad.mp4',cat:'Brand · Commercial'},
  {n:'11',name:'Reel',file:'Reelvideo-29689.mp4',cat:'Showreel · Motion'},
];
const indexList=document.getElementById('index-list');
const filmWall=document.getElementById('film-wall');
const focusPanel=document.getElementById('focus-panel');
const focusVideo=document.getElementById('focus-video');
const focusTitle=document.getElementById('focus-title');
const focusSub=document.getElementById('focus-sub');
const focusClose=document.getElementById('focus-close');
FILMS.forEach((f,i)=>{
  const li=document.createElement('li');
  li.className='index-item';
  li.innerHTML=`<span class="idx-num">${f.n}</span><video class="idx-thumb" src="${CDN}${f.file}" muted preload="metadata" style="pointer-events:none"></video><div class="idx-info"><div class="idx-name">${f.name}</div><div class="idx-meta">${f.cat}</div></div>`;
  li.addEventListener('click',()=>openFilm(i));
  indexList.appendChild(li);
  const card=document.createElement('div');
  card.className='film-card';
  card.innerHTML=`<video class="film-video" src="${CDN}${f.file}" muted preload="metadata" loop playsinline></video><div class="film-overlay"><div class="film-num">${f.n}</div><div class="film-title">${f.name}</div></div><div class="film-play">▶</div>`;
  const vid=card.querySelector('.film-video');
  card.addEventListener('mouseenter',()=>vid.play());
  card.addEventListener('mouseleave',()=>{vid.pause();vid.currentTime=0;});
  card.addEventListener('click',()=>openFilm(i));
  filmWall.appendChild(card);
});
function openFilm(i){
  const f=FILMS[i];
  focusVideo.src=CDN+f.file;focusVideo.play();
  focusTitle.textContent=f.name;focusSub.textContent=f.cat;
  focusPanel.classList.add('visible');
  document.querySelectorAll('.index-item').forEach((el,j)=>el.classList.toggle('active',j===i));
  document.querySelector('.wall-col').scrollTo({top:0,behavior:'smooth'});
}
focusClose.addEventListener('click',()=>{
  focusPanel.classList.remove('visible');focusVideo.pause();
  document.querySelectorAll('.index-item').forEach(el=>el.classList.remove('active'));
});
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');});},{threshold:.1});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>
