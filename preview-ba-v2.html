<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before & After — Design Preview v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #06050c;
  --bg-1:    #0b0a14;
  --bg-2:    #100f1c;
  --ink:     rgba(255,255,255,.92);
  --ink-dim: rgba(255,255,255,.45);
  --ink-mute:rgba(255,255,255,.20);
  --ink-ghost:rgba(255,255,255,.06);
  --accent:  #e8d5b0;
  --f-display:'Inter Tight',sans-serif;
  --f-mono:'DM Mono',monospace;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-snap:cubic-bezier(.16,1,.3,1);
  --card-h: 80vh;
  --card-w: calc(var(--card-h) * 9 / 16);
  --card-gap: 20px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);color:var(--ink);font-family:var(--f-display);}
body{min-height:100vh;overflow-x:hidden;}
::selection{background:var(--accent);color:#06050c;}

/* ── PAGE HEADER ── */
.page-header {
  padding: 56px 64px 0;
  border-bottom: 1px solid var(--ink-ghost);
  padding-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.page-label {
  font-family: var(--f-mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.page-note {
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.15em;
}

/* ── SECTION ── */
.section {
  padding: 64px 0 80px;
  position: relative;
}
.section-head {
  padding: 0 64px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 48px;
}
.section-title {
  font-family: var(--f-display);
  font-weight: 200;
  font-size: clamp(28px, 3.5vw, 48px);
  letter-spacing: -0.02em;
  color: var(--ink);
}
.section-meta {
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--ink-dim);
  letter-spacing: 0.3em;
  text-transform: uppercase;
}

/* ── REEL STAGE ── */
.reel-stage {
  position: relative;
  height: var(--card-h);
  overflow: hidden;
}
.reel-stage::before,
.reel-stage::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 160px;
  z-index: 10;
  pointer-events: none;
}
.reel-stage::before {
  left: 0;
  background: linear-gradient(to right, var(--bg) 20%, transparent);
}
.reel-stage::after {
  right: 0;
  background: linear-gradient(to left, var(--bg) 20%, transparent);
}
.reel-track {
  position: absolute;
  top: 0; height: 100%;
  left: 50%;
  display: flex;
  align-items: center;
}

/* ── CARD ── */
.card {
  position: absolute;
  width: var(--card-w);
  height: var(--card-h);
  flex-shrink: 0;
  cursor: pointer;
  transition: transform 0.6s var(--ease-snap), opacity 0.5s var(--ease-out);
  user-select: none;
}
.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-2);
}
.card-inner::after {
  content: '';
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 40px rgba(0,0,0,.5);
  pointer-events: none;
  z-index: 4;
}
/* Each card: after-img base, before-wrap clips left portion */
.after-img,
.before-img {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
}
.before-wrap {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 50%;
  overflow: hidden;
  z-index: 2;
}
.before-wrap .before-img {
  /* before-img must always be the full card width, even inside the clip wrapper */
  width: var(--card-w);
  height: 100%;
}

/* ── DIVIDER ── */
.divider {
  position: absolute;
  top: 0; bottom: 0;
  left: 50%;
  width: 1px;
  background: var(--ink);
  z-index: 5;
  cursor: ew-resize;
  transition: opacity 0.3s;
}
.divider::before {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: -12px; right: -12px;
  cursor: ew-resize;
}
.divider-handle {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  box-shadow: 0 2px 12px rgba(0,0,0,.6);
}
.divider-arrow {
  font-size: 11px;
  color: var(--bg);
  line-height: 1;
  font-family: var(--f-display);
  font-weight: 400;
}
.divider-label {
  position: absolute;
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--ink);
  top: 16px;
  padding: 4px 8px;
  background: rgba(6,5,12,0.7);
  backdrop-filter: blur(8px);
}
.divider-label.before { right: calc(100% + 8px); }
.divider-label.after  { left:  calc(100% + 8px); }

/* ── CARD OVERLAYS ── */
.proj-num {
  position: absolute;
  top: 14px; left: 14px;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--accent);
  z-index: 6;
  opacity: 0.9;
}
.expand-btn {
  position: absolute;
  bottom: 14px; right: 14px;
  z-index: 6;
  width: 32px; height: 32px;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 2px;
  background: rgba(6,5,12,.7);
  backdrop-filter: blur(8px);
  color: var(--ink-dim);
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.2s, color 0.2s;
  font-family: var(--f-mono);
}
.expand-btn:hover { border-color: var(--accent); color: var(--accent); }
.drag-hint {
  position: absolute;
  bottom: 14px; left: 50%; transform: translateX(-50%);
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-dim);
  background: rgba(6,5,12,.7);
  backdrop-filter: blur(8px);
  padding: 5px 10px;
  z-index: 6;
  opacity: 1;
  transition: opacity 0.4s;
  white-space: nowrap;
}
.drag-hint.hidden { opacity: 0; pointer-events: none; }

/* inactive card overlay */
.card-overlay {
  position: absolute;
  inset: 0;
  background: rgba(6,5,12,.4);
  z-index: 7;
  transition: opacity 0.4s;
  pointer-events: none;
}
.card.active .card-overlay { opacity: 0; }

/* ── CARD META (below active card) ── */
.reel-meta {
  padding: 20px 64px 0;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.proj-title {
  font-family: var(--f-display);
  font-weight: 200;
  font-size: 20px;
  letter-spacing: -0.01em;
  color: var(--ink);
  transition: opacity 0.4s;
}
.proj-counter {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--ink-dim);
}

/* ── NAVIGATION ARROWS ── */
.nav-btn {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  z-index: 20;
  width: 48px; height: 48px;
  border: 1px solid var(--ink-ghost);
  border-radius: 50%;
  background: rgba(6,5,12,.8);
  backdrop-filter: blur(12px);
  color: var(--ink-dim);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.2s, color 0.2s, opacity 0.2s;
  font-family: var(--f-display);
}
.nav-btn:hover { border-color: var(--accent); color: var(--ink); }
.nav-btn.prev { left: 32px; }
.nav-btn.next { right: 32px; }
.nav-btn:disabled { opacity: 0.25; pointer-events: none; }

/* ── FILM INDEX DOTS ── */
.film-index {
  padding: 32px 64px 0;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.film-dot {
  width: 20px; height: 2px;
  background: var(--ink-ghost);
  cursor: pointer;
  transition: background 0.3s, width 0.3s;
  flex-shrink: 0;
}
.film-dot.active {
  background: var(--accent);
  width: 40px;
}

/* ── FULLSCREEN OVERLAY ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(6,5,12,.96);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s var(--ease-out);
  backdrop-filter: blur(16px);
}
.overlay.open {
  opacity: 1;
  pointer-events: all;
}
.overlay-inner {
  position: relative;
  height: 88vh;
  width: calc(88vh * 9 / 16);
}
.overlay-inner .card-inner { border-radius: 0; }
.overlay-close {
  position: absolute;
  top: -48px; right: 0;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-dim);
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px 0;
  transition: color 0.2s;
}
.overlay-close:hover { color: var(--ink); }
.overlay-proj-num {
  position: absolute;
  top: -48px; left: 0;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--accent);
  text-transform: uppercase;
}

/* ── LOADING STATE ── */
.card-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 8;
  background: var(--bg-2);
  transition: opacity 0.4s;
}
.card-loading.done { opacity: 0; pointer-events: none; }
.load-pulse {
  width: 1px; height: 24px;
  background: var(--ink-ghost);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
  0%,100%{opacity:0.2;transform:scaleY(1);}
  50%{opacity:1;transform:scaleY(1.6);}
}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  :root { --card-h: 65vh; }
  .page-header { padding: 32px 24px 16px; }
  .section-head { padding: 0 24px; margin-bottom: 32px; }
  .nav-btn.prev { left: 12px; }
  .nav-btn.next { right: 12px; }
  .reel-meta { padding: 16px 24px 0; }
  .film-index { padding: 24px 24px 0; }
  .overlay-inner { height: 80vh; width: calc(80vh * 9 / 16); }
}
</style>
</head>
<body>

<header class="page-header">
  <span class="page-label">Design Preview · Before & After · v2</span>
  <span class="page-note">Development branch only — not production</span>
</header>

<section class="section">
  <div class="section-head">
    <h2 class="section-title">Before & After</h2>
    <span class="section-meta">14 projects · CGI · VFX</span>
  </div>

  <!-- REEL STAGE -->
  <div class="reel-stage" id="reelStage">
    <div class="reel-track" id="reelTrack"></div>
    <button class="nav-btn prev" id="prevBtn" aria-label="Previous">&#8592;</button>
    <button class="nav-btn next" id="nextBtn" aria-label="Next">&#8594;</button>
  </div>

  <!-- META -->
  <div class="reel-meta">
    <span class="proj-title" id="projTitle">Project 01</span>
    <span class="proj-counter" id="projCounter">01 / 14</span>
  </div>

  <!-- FILM INDEX -->
  <div class="film-index" id="filmIndex"></div>
</section>

<!-- FULLSCREEN OVERLAY -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="overlay-inner" id="overlayInner">
    <span class="overlay-proj-num" id="overlayNum">01 / 14</span>
    <button class="overlay-close" id="overlayClose">Close &nbsp;✕</button>
    <div class="card-inner" id="overlayCard">
      <img class="after-img" id="overlayAfter" src="" alt="">
      <div class="before-wrap" id="overlayBeforeWrap">
        <img class="before-img" id="overlayBefore" src="" alt="">
      </div>
      <div class="divider" id="overlayDivider">
        <div class="divider-handle">
          <span class="divider-arrow">&#8592;</span>
          <span class="divider-arrow">&#8594;</span>
        </div>
        <span class="divider-label before">BEFORE</span>
        <span class="divider-label after">AFTER</span>
      </div>
    </div>
  </div>
</div>

<script type="module">
const CDN = 'https://pub-88341f47988743aba3154d2af5c6327e.r2.dev';

const PROJECTS = Array.from({length: 14}, (_, i) => ({
  n: String(i + 1).padStart(2, '0'),
  label: `Project ${String(i + 1).padStart(2, '0')}`,
  before: `${CDN}/gallery/Before%20and%20After/Before%20${i + 1}.webp`,
  after:  `${CDN}/gallery/Before%20and%20After/After%20${i + 1}.webp`,
}));

let active = 0;
const track = document.getElementById('reelTrack');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const projTitle = document.getElementById('projTitle');
const projCounter = document.getElementById('projCounter');
const filmIndexEl = document.getElementById('filmIndex');
const overlay = document.getElementById('overlay');
const overlayClose = document.getElementById('overlayClose');
const overlayNum = document.getElementById('overlayNum');
const overlayCard = document.getElementById('overlayCard');
const overlayAfter = document.getElementById('overlayAfter');
const overlayBeforeWrap = document.getElementById('overlayBeforeWrap');
const overlayBefore = document.getElementById('overlayBefore');
const overlayDivider = document.getElementById('overlayDivider');

// Get card dimensions from CSS vars
function getCardW() {
  const stage = document.getElementById('reelStage');
  const h = stage.offsetHeight;
  return Math.round(h * 9 / 16);
}

// Build cards
const cards = PROJECTS.map((proj, i) => {
  const card = document.createElement('div');
  card.className = 'card' + (i === 0 ? ' active' : '');
  card.dataset.index = i;

  card.innerHTML = `
    <div class="card-inner">
      <div class="card-loading"><div class="load-pulse"></div></div>
      <img class="after-img" src="${proj.after}" alt="After ${proj.n}">
      <div class="before-wrap">
        <img class="before-img" src="${proj.before}" alt="Before ${proj.n}">
      </div>
      <div class="divider">
        <div class="divider-handle">
          <span class="divider-arrow">&#8592;</span>
          <span class="divider-arrow">&#8594;</span>
        </div>
        <span class="divider-label before">BEFORE</span>
        <span class="divider-label after">AFTER</span>
      </div>
      <span class="proj-num">${proj.n}</span>
      <div class="drag-hint" id="drag-hint-${i}">DRAG TO COMPARE</div>
      <button class="expand-btn" data-expand="${i}" aria-label="Expand">⤢</button>
      <div class="card-overlay"></div>
    </div>
  `;

  // Fix before-img width once card is in DOM
  const beforeImg = card.querySelector('.before-img');
  const beforeWrap = card.querySelector('.before-wrap');
  const divider = card.querySelector('.divider');
  const hint = card.querySelector('.drag-hint');
  let hintShown = true;

  function setBeforeImgWidth() {
    const w = getCardW();
    beforeImg.style.width = w + 'px';
  }

  // Images loaded
  let loaded = 0;
  const loading = card.querySelector('.card-loading');
  [card.querySelector('.after-img'), beforeImg].forEach(img => {
    if (img.complete) { loaded++; if(loaded===2) loading.classList.add('done'); }
    else img.addEventListener('load', () => { loaded++; if(loaded===2) loading.classList.add('done'); });
    img.addEventListener('error', () => { loaded++; if(loaded===2) loading.classList.add('done'); });
  });

  // Drag divider
  initDivider(card, divider, beforeWrap, beforeImg, hint, () => hintShown);

  // Expand button
  card.querySelector('.expand-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    openOverlay(i);
  });

  // Click inactive card to activate
  card.addEventListener('click', (e) => {
    if (!card.classList.contains('active')) setActive(i);
  });

  track.appendChild(card);
  setBeforeImgWidth();

  return { el: card, beforeImg, beforeWrap, divider };
});

// Film index
PROJECTS.forEach((_, i) => {
  const dot = document.createElement('div');
  dot.className = 'film-dot' + (i === 0 ? ' active' : '');
  dot.addEventListener('click', () => setActive(i));
  filmIndexEl.appendChild(dot);
});

function setActive(index) {
  active = Math.max(0, Math.min(PROJECTS.length - 1, index));
  const cardW = getCardW();
  const gap = 20;

  cards.forEach(({el}, i) => {
    const offset = (i - active) * (cardW + gap);
    const dist = Math.abs(i - active);
    el.style.transform = `translateX(calc(-50% + ${offset}px))`;
    el.style.opacity = dist === 0 ? '1' : dist === 1 ? '0.45' : dist === 2 ? '0.22' : '0.1';
    el.classList.toggle('active', i === active);
    el.style.pointerEvents = dist === 0 ? 'auto' : dist <= 1 ? 'auto' : 'none';
  });

  document.querySelectorAll('.film-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === active);
  });

  projTitle.textContent = PROJECTS[active].label;
  projCounter.textContent = `${PROJECTS[active].n} / 14`;
  prevBtn.disabled = active === 0;
  nextBtn.disabled = active === PROJECTS.length - 1;
}

function initDivider(card, divider, beforeWrap, beforeImg, hint, getHintShown) {
  let dragging = false;

  divider.addEventListener('pointerdown', (e) => {
    if (!card.classList.contains('active')) return;
    dragging = true;
    divider.setPointerCapture(e.pointerId);
    if (hint && getHintShown()) {
      hint.classList.add('hidden');
    }
    e.preventDefault();
  });

  divider.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rect = card.querySelector('.card-inner').getBoundingClientRect();
    const pct = Math.max(2, Math.min(98, ((e.clientX - rect.left) / rect.width) * 100));
    divider.style.left = pct + '%';
    beforeWrap.style.width = pct + '%';
  });

  divider.addEventListener('pointerup', () => { dragging = false; });
  divider.addEventListener('pointercancel', () => { dragging = false; });
}

// Overlay
function openOverlay(index) {
  const proj = PROJECTS[index];
  overlayNum.textContent = `${proj.n} / 14`;
  overlayAfter.src = proj.after;
  overlayBefore.src = proj.before;
  overlayBeforeWrap.style.width = '50%';
  overlayDivider.style.left = '50%';

  // Fix overlay before-img width
  const oh = overlayCard.parentElement.offsetHeight;
  const ow = Math.round(oh * 9 / 16);
  overlayBefore.style.width = overlayCard.parentElement.offsetWidth + 'px';

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

overlayClose.addEventListener('click', closeOverlay);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeOverlay(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOverlay(); });

function closeOverlay() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

// Overlay divider drag
initDivider(overlayCard, overlayDivider, overlayBeforeWrap, overlayBefore, null, () => false);

// Navigation
prevBtn.addEventListener('click', () => setActive(active - 1));
nextBtn.addEventListener('click', () => setActive(active + 1));

document.addEventListener('keydown', (e) => {
  if (overlay.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') setActive(active - 1);
  if (e.key === 'ArrowRight') setActive(active + 1);
});

// Touch/swipe
let touchStartX = 0;
document.getElementById('reelStage').addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
document.getElementById('reelStage').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) setActive(active + (dx < 0 ? 1 : -1));
}, {passive:true});

// Resize
window.addEventListener('resize', () => {
  cards.forEach(({beforeImg}) => {
    beforeImg.style.width = getCardW() + 'px';
  });
  setActive(active);
});

// Init
setActive(0);
</script>
</body>
</html>
