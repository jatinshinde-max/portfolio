<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selected Worlds — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,200;0,300;0,400;0,500;1,200;1,300&family=Inter:wght@300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>

/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:        #06050c;
  --ink:       rgba(255,255,255,0.90);
  --ink-dim:   rgba(255,255,255,0.40);
  --ink-mute:  rgba(255,255,255,0.16);
  --ink-ghost: rgba(255,255,255,0.05);
  --accent:    #c46428; /* Ashfall default — JS overrides per world */

  --f-display: 'Inter Tight', sans-serif;
  --f-body:    'Inter', sans-serif;
  --f-mono:    'DM Mono', monospace;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-cin: cubic-bezier(0.16, 1, 0.3, 1);
}

/* ── RESET ──────────────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; scroll-behavior: auto; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-weight: 300;
  overflow-x: hidden;
  cursor: none;
  -webkit-font-smoothing: antialiased;
}
@media (hover:none),(pointer:coarse) { body { cursor: auto; } }

/* ── CURSOR ─────────────────────────────────────────────── */
#c-dot, #c-ring {
  position: fixed; top: 0; left: 0;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%);
  will-change: transform;
}
#c-dot {
  width: 5px; height: 5px;
  background: var(--ink);
  border-radius: 50%;
  mix-blend-mode: difference;
}
#c-ring {
  width: 28px; height: 28px;
  border: 1px solid rgba(255,255,255,0.45);
  border-radius: 50%;
  transition: transform 0.22s var(--ease-out), border-color 0.22s;
}
#c-ring.expand {
  transform: translate(-50%,-50%) scale(1.65);
  border-color: var(--accent);
}
@media (hover:none),(pointer:coarse) { #c-dot, #c-ring { display: none; } }

/* ═══════════════════════════════════════════════════════════ */
/* SEQ1 PROXY — PROTOTYPE SCAFFOLD ONLY                       */
/* In production: actual Sequence1 scroll experience lives    */
/* here — this section does not exist as a real page element. */
/* ═══════════════════════════════════════════════════════════ */
#seq1-proxy {
  position: relative;
  height: 100vh;
  background: var(--bg);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
}
#seq1-proxy::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 80px;
  background: linear-gradient(transparent, var(--bg));
  z-index: 2;
  pointer-events: none;
}
.seq1-bg {
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 90% 70% at 40% 60%, rgba(18,14,28,0.95) 0%, rgba(6,5,12,0.98) 70%),
    radial-gradient(ellipse 60% 80% at 70% 25%, rgba(10,8,20,0.9) 0%, transparent 65%);
}
.seq1-scaffold-label {
  position: absolute;
  top: 28px; left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  text-align: center;
  pointer-events: none;
}
.seq1-scaffold-label span {
  display: block;
  font-family: var(--f-mono);
  font-size: 8px;
  font-weight: 300;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.seq1-scaffold-label strong {
  display: block;
  font-family: var(--f-mono);
  font-size: 7px;
  font-weight: 300;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.1);
  margin-top: 6px;
}
.seq1-scroll-hint {
  position: relative; z-index: 3;
  margin-bottom: 60px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  opacity: 0.28;
}
.seq1-scroll-hint span {
  font-family: var(--f-mono); font-size: 8px; font-weight: 300;
  letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink);
}
.seq1-scroll-line {
  width: 1px; height: 36px;
  background: linear-gradient(transparent, var(--ink));
  animation: scroll-pulse 2s ease-in-out infinite;
}
@keyframes scroll-pulse {
  0%, 100% { opacity: 0.3; transform: scaleY(0.5) translateY(-6px); }
  55%       { opacity: 1;   transform: scaleY(1) translateY(0); }
}

/* ═══════════════════════════════════════════════════════════ */
/* WORLDS SECTION                                             */
/* ═══════════════════════════════════════════════════════════ */
#worlds-section {
  position: relative;
  height: 100vh;
  overflow: hidden;
  opacity: 0;
  background: var(--bg);
}
#worlds-section.is-revealed {
  opacity: 1;
  transition: opacity 1s var(--ease-out);
}

/* ── CANVASES ────────────────────────────────────────────── */
/* Two canvases stack: A is current world, B is incoming.    */
/* CSS transition on B handles the GPU-composited crossfade. */
#worlds-canvas-a,
#worlds-canvas-b {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
}
#worlds-canvas-a { z-index: 1; }
#worlds-canvas-b {
  z-index: 2;
  opacity: 0;
  transform: scale(1.04);
  /* Scale settles slightly longer than opacity for natural depth feel */
  transition:
    opacity 0.75s var(--ease-out),
    transform 1.0s var(--ease-cin);
}
#worlds-canvas-b.transitioning {
  opacity: 1;
  transform: scale(1);
}

/* ── OVERLAYS ────────────────────────────────────────────── */
#worlds-vignette {
  position: absolute; inset: 0; z-index: 5; pointer-events: none;
  background:
    radial-gradient(ellipse 75% 75% at 50% 50%, transparent 38%, rgba(6,5,12,0.5) 100%),
    linear-gradient(180deg, rgba(6,5,12,0.38) 0%, transparent 20%, transparent 62%, rgba(6,5,12,0.88) 100%),
    linear-gradient(90deg, rgba(6,5,12,0.28) 0%, transparent 14%, transparent 86%, rgba(6,5,12,0.28) 100%);
}
#worlds-grain {
  position: absolute; inset: 0; z-index: 6; pointer-events: none;
  opacity: 0.022;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
  animation: grain 0.5s steps(1) infinite;
}
@keyframes grain {
  0%  { background-position:   0   0; }
  20% { background-position: -42px  18px; }
  40% { background-position:  58px -28px; }
  60% { background-position: -18px  52px; }
  80% { background-position:  32px -12px; }
}

/* ── LOADING OVERLAY ─────────────────────────────────────── */
#worlds-loading {
  position: absolute; inset: 0; z-index: 7;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.5s var(--ease-out);
}
#worlds-loading.hidden { opacity: 0; pointer-events: none; }
.wl-track {
  width: 100px; height: 1px; background: var(--ink-ghost); position: relative; overflow: hidden;
}
.wl-track::after {
  content: '';
  position: absolute; left: -100%; top: 0; width: 100%; height: 100%;
  background: var(--accent);
  animation: wl-scan 1.1s var(--ease-out) infinite;
}
@keyframes wl-scan { to { left: 100%; } }

/* ── WORLD INFO ─────────────────────────────────────────── */
/* Bottom-left: current world identity */
#world-info {
  position: absolute;
  bottom: 88px; left: 44px;
  z-index: 10;
  pointer-events: none;
  /* Transition defined here; switching/arriving override transform+opacity */
  transition: transform 0.48s var(--ease-out), opacity 0.48s var(--ease-out);
}
/* Slide down + fade on deactivate */
#world-info.switching {
  transform: translateY(12px);
  opacity: 0;
}
/* Snap to above + invisible before new world's info arrives */
#world-info.arriving {
  transform: translateY(-14px);
  opacity: 0;
  transition: none; /* Snap immediately; normal transition handles settle */
}

.wi-frac {
  font-family: var(--f-mono);
  font-size: 9px; font-weight: 300; letter-spacing: 0.24em;
  color: var(--ink-mute);
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.wi-frac-sep { width: 18px; height: 1px; background: var(--ink-mute); }

.wi-name {
  font-family: var(--f-display);
  font-size: clamp(2.2rem, 3.6vw, 3.8rem);
  font-weight: 300;
  letter-spacing: -0.015em;
  line-height: 1;
  color: var(--ink);
  margin-bottom: 10px;
  position: relative;
}
/* Left accent bar: 2px line, per-world color */
.wi-name::before {
  content: '';
  position: absolute;
  left: -15px; top: 8%; bottom: 8%;
  width: 2px;
  background: var(--accent);
  border-radius: 1px;
  transition: background 0.65s var(--ease-out);
}

.wi-tag {
  font-family: var(--f-mono);
  font-size: 9px; font-weight: 300; letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

/* ── WORLD INDEX ─────────────────────────────────────────── */
/* Horizontal strip, bottom-right — environment dominates,   */
/* index remains subordinate and quiet                        */
#world-index {
  position: absolute;
  bottom: 28px; right: 36px;
  z-index: 10;
  display: flex;
  align-items: flex-end;
  gap: 0;
}

.wi-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 5px;
  padding: 12px 13px 10px;
  cursor: pointer;
  background: transparent;
  border: none;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  /* Each button transitions its content independently */
  transition: opacity 0.3s var(--ease-out);
}
/* Top accent line: thin, quiet when inactive */
.wi-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 13px; right: 13px;
  height: 1px;
  background: var(--ink-ghost);
  transition: background 0.4s var(--ease-out);
}
.wi-btn.active::before {
  background: var(--accent);
  transition: background 0.65s var(--ease-out);
}
.wi-btn:hover::before { background: rgba(255,255,255,0.15); }
.wi-btn.active:hover::before { background: var(--accent); }

.wi-btn-num {
  font-family: var(--f-mono);
  font-size: 8px; font-weight: 300; letter-spacing: 0.2em;
  color: var(--ink-mute);
  transition: color 0.35s;
}
.wi-btn.active .wi-btn-num { color: var(--accent); }

.wi-btn-name {
  font-family: var(--f-display);
  font-size: 10px; font-weight: 400; letter-spacing: 0.05em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.22);
  transition: color 0.35s;
  white-space: nowrap;
}
.wi-btn.active .wi-btn-name { color: rgba(255,255,255,0.75); }

/* Mobile: span full width */
@media (max-width: 768px) {
  #world-index {
    left: 0; right: 0; bottom: 0;
    justify-content: stretch;
    background: linear-gradient(transparent, rgba(6,5,12,0.75));
    padding-bottom: env(safe-area-inset-bottom, 12px);
  }
  .wi-btn { flex: 1; align-items: center; padding: 10px 4px 8px; }
  .wi-btn::before { left: 4px; right: 4px; }
  .wi-btn-name { font-size: 8px; }
  #world-info { left: 20px; bottom: 100px; }
  .wi-name { font-size: clamp(1.8rem, 6vw, 3rem); }
}

/* ── PROGRESS BAR ────────────────────────────────────────── */
/* Top edge: thin, shows ambient animation cycle position */
#worlds-progress {
  position: absolute; top: 0; left: 0;
  height: 1px; z-index: 11;
  background: var(--accent);
  width: 0%;
  transition: background 0.65s var(--ease-out);
  opacity: 0.5;
  pointer-events: none;
}

/* ── FRAME RATE BADGE (diagnostic) ──────────────────────── */
#diag-panel {
  position: absolute;
  bottom: 28px; left: 44px;
  z-index: 12;
  font-family: var(--f-mono);
  font-size: 8px; font-weight: 300; letter-spacing: 0.2em;
  color: rgba(255,255,255,0.25);
  pointer-events: none;
  text-transform: uppercase;
  line-height: 1.7;
  display: none; /* visible via ?diag=1 */
}
body.show-diag #diag-panel { display: block; }
body.show-diag #world-info { bottom: 148px; }

/* ── AFTER-WORLDS ─────────────────────────────────────────── */
#after-worlds {
  height: 55vh;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  border-top: 1px solid var(--ink-ghost);
}
.aw-label {
  font-family: var(--f-mono);
  font-size: 8px; font-weight: 300; letter-spacing: 0.28em;
  color: var(--ink-mute); text-transform: uppercase; text-align: center;
}

/* ── PROTO BADGE ─────────────────────────────────────────── */
#proto-badge {
  position: fixed; top: 18px; right: 18px; z-index: 9990;
  font-family: var(--f-mono); font-size: 7px; font-weight: 300;
  letter-spacing: 0.22em; color: var(--ink-mute); text-transform: uppercase;
  background: rgba(6,5,12,0.65); padding: 5px 9px;
  border: 1px solid var(--ink-ghost);
  pointer-events: none;
}

</style>
</head>

<script type="module">

// ──────────────────────────────────────────────────────────────
// CONSTANTS
// ──────────────────────────────────────────────────────────────
const CDN = 'https://pub-88341f47988743aba3154d2af5c6327e.r2.dev';

// Memory: maximum decoded frames kept per world.
// At 1920×1080 RGBA → ~8 MB per frame.
// 40 frames × 8 MB = ~320 MB for the one active world.
// Inactive worlds: zero decoded frames (only poster bitmap ~8 MB).
// Total ceiling: active world frames (~320 MB) + 5 posters (~40 MB) ≈ 360 MB.
const PREVIEW_CAP    = 40;

// Ambient animation: 10fps.
// Source is UE5 frames sampled every-4th of an ~30fps render ≈ 7.5fps native.
// 10fps plays the strided preview sequence at ~1.3× speed — good for ambient.
// 12fps felt rushed; 8fps felt sluggish. 10fps is the balance.
const FRAME_INTERVAL = 100; // ms

const TRANSITION_MS  = 750; // crossfade duration
const BG_BATCH       = 6;   // concurrent frame fetches per round
const BG_DELAY       = 55;  // ms between batches

// ──────────────────────────────────────────────────────────────
// WORLD DATA
// ──────────────────────────────────────────────────────────────
const WORLDS = [
  {
    slug: 'world-01', name: 'Ashfall',
    frameCount: 111, accent: '#c46428',
    // world-01 is in worlds.config.js; not in production canvas WORLDS array.
    // Session log states all 5 worlds uploaded to R2 on 19/05/2026.
    // Poster probe result will be reported via diag panel + console.
    posterFrame: 1,
  },
  {
    slug: 'world-02', name: 'Luminara',
    frameCount: 165, accent: '#7c5cc4',
    posterFrame: 1, // confirmed: production WORLDS array
  },
  {
    slug: 'world-03', name: 'Verdant',
    frameCount: 124, accent: '#3a8c52',
    posterFrame: 61, // confirmed: frame_0061.webp in production <img> tag
  },
  {
    slug: 'world-04', name: 'Helios',
    frameCount: 179, accent: '#2872c4',
    // world-04 is in worlds.config.js; not in production canvas WORLDS array.
    posterFrame: 1,
  },
  {
    slug: 'world-05', name: 'Aurum',
    frameCount: 375, accent: '#c4a028',
    // 375 frames — PREVIEW_CAP = 40 limits ambient preview.
    // Strided loading samples every ~9th frame, covering the full sequence range.
    posterFrame: 1, // confirmed: production WORLDS array
  },
];

// ──────────────────────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────────────────────
let activeWorld = 0;
let isTransition = false;

const worldState = WORLDS.map(() => ({
  poster:     null,   // HTMLImageElement
  posterBmp:  null,   // ImageBitmap (decoded poster)
  posterOK:   null,   // null=pending, true=loaded, false=error
  frames:     [],     // ImageBitmap[] ambient preview frames (bounded by PREVIEW_CAP)
  frameNums:  [],     // parallel: which frame numbers are loaded
  animIdx:    0,
  loadState:  'idle', // idle | loading | done | error
  abortCtrl:  null,
}));

// Verification tracking for diag panel
const worldVerify = WORLDS.map(() => ({ poster: null }));

let lastTs     = 0;
let frameTimer = 0;
let animDirty  = true;

// Parallax (desktop only)
const PARALLAX_AMP_X = 8, PARALLAX_AMP_Y = 5;
const PARALLAX_K     = 0.022;
const PARALLAX_THR   = 0.04;
let tPX = 0, tPY = 0, cPX = 0, cPY = 0, lPX = 0, lPY = 0;

// DOM refs
const canvasA    = document.getElementById('worlds-canvas-a');
const canvasB    = document.getElementById('worlds-canvas-b');
const ctxA       = canvasA.getContext('2d');
const ctxB       = canvasB.getContext('2d');
const worldInfo  = document.getElementById('world-info');
const wiName     = document.getElementById('wi-name');
const wiCur      = document.getElementById('wi-cur');
const progBar    = document.getElementById('worlds-progress');
const loadOverlay= document.getElementById('worlds-loading');
const indexBtns  = [...document.querySelectorAll('.wi-btn')];
const diagPanel  = document.getElementById('diag-panel');

let W = 0, H = 0;
const DPR = Math.min(devicePixelRatio, 2);
const isMob = matchMedia('(max-width:768px),(pointer:coarse)').matches;
const showDiag = location.search.includes('diag=1');
if (showDiag) document.body.classList.add('show-diag');

// ──────────────────────────────────────────────────────────────
// RESIZE
// ──────────────────────────────────────────────────────────────
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  const pw = W * DPR, ph = H * DPR;
  for (const cv of [canvasA, canvasB]) {
    cv.width  = pw; cv.height = ph;
    cv.style.width  = W + 'px'; cv.style.height = H + 'px';
  }
  animDirty = true;
}
window.addEventListener('resize', resize);
resize();

// ──────────────────────────────────────────────────────────────
// DRAW — cover-fit image onto a canvas context with parallax
// ──────────────────────────────────────────────────────────────
function drawCover(ctx, img) {
  if (!img) return;
  const sw = img.width  || img.naturalWidth  || 0;
  const sh = img.height || img.naturalHeight || 0;
  if (!sw || !sh) return;

  // 1.06 overscan gives parallax headroom without visible border
  const overscan = isMob ? 1.0 : 1.06;
  const scale    = Math.max((W * DPR) / sw, (H * DPR) / sh) * overscan;
  const dw = sw * scale, dh = sh * scale;
  const ox = isMob ? 0 : cPX * DPR;
  const oy = isMob ? 0 : cPY * DPR;
  const dx = ((W * DPR) - dw) / 2 + ox;
  const dy = ((H * DPR) - dh) / 2 + oy;
  ctx.drawImage(img, dx, dy, dw, dh);
}

// ──────────────────────────────────────────────────────────────
// POSTER LOAD — one per world; light (1 frame); kept forever
// ──────────────────────────────────────────────────────────────
function loadPoster(idx) {
  const w  = WORLDS[idx];
  const st = worldState[idx];
  if (st.posterOK !== null) return; // already attempted
  st.posterOK = 'pending';

  const img = new Image();
  img.crossOrigin = 'anonymous';
  const n = String(w.posterFrame).padStart(4, '0');
  img.src = `${CDN}/${w.slug}/frame_${n}.webp`;

  img.onload = () => {
    st.poster   = img;
    st.posterOK = true;
    worldVerify[idx].poster = 'OK';
    console.log(`[worlds] ${w.slug} poster OK — frame_${n}.webp`);
    createImageBitmap(img).then(bmp => { st.posterBmp = bmp; animDirty = true; }).catch(() => {});
    if (idx === activeWorld) {
      loadOverlay.classList.add('hidden');
      animDirty = true;
    }
    updateDiag();
  };
  img.onerror = () => {
    st.posterOK = false;
    worldVerify[idx].poster = `ERROR — ${CDN}/${w.slug}/frame_${n}.webp`;
    console.warn(`[worlds] ${w.slug} poster FAILED — frame_${n}.webp — check R2`);
    if (idx === activeWorld) loadOverlay.classList.add('hidden');
    updateDiag();
  };
}

// Active world poster immediately; others stagger after ~1s
loadPoster(0);
setTimeout(() => { for (let i = 1; i < WORLDS.length; i++) loadPoster(i); }, 1100);

// ──────────────────────────────────────────────────────────────
// EVICT WORLD — release decoded frames; keep poster
// Called when a world becomes inactive after a transition.
// ──────────────────────────────────────────────────────────────
function evictWorld(idx) {
  const st = worldState[idx];
  // Cancel any in-progress load
  if (st.abortCtrl) {
    st.abortCtrl.abort();
    st.abortCtrl = null;
  }
  // Close and release all decoded ImageBitmap objects
  for (const bmp of st.frames) {
    if (bmp && typeof bmp.close === 'function') bmp.close();
  }
  st.frames    = [];
  st.frameNums = [];
  st.animIdx   = 0;
  // Reset to idle: world can be re-loaded on next activation
  // HTTP cache retains downloaded data, so re-fetch is fast
  if (st.loadState !== 'done') st.loadState = 'idle';
  // Keep: st.poster, st.posterBmp, st.posterOK
}

// ──────────────────────────────────────────────────────────────
// FRAME SEQUENCE LOAD — strided, bounded by PREVIEW_CAP
// Stride = floor(frameCount / PREVIEW_CAP), so frames sample
// evenly across the entire sequence range (not just the first N).
// ──────────────────────────────────────────────────────────────
async function loadWorldFrames(idx) {
  const st = worldState[idx];
  if (st.loadState === 'loading' || st.loadState === 'done') return;
  st.loadState = 'loading';

  const ctrl = new AbortController();
  st.abortCtrl = ctrl;
  const w = WORLDS[idx];

  // Build strided frame list covering full sequence range
  const stride = Math.max(1, Math.floor(w.frameCount / PREVIEW_CAP));
  const frameNums = [];
  for (let i = 1; i <= w.frameCount && frameNums.length < PREVIEW_CAP; i += stride) {
    frameNums.push(i);
  }

  let firstReveal = false;

  for (let i = 0; i < frameNums.length; i += BG_BATCH) {
    if (ctrl.signal.aborted) return;

    const batch = frameNums.slice(i, i + BG_BATCH);
    await Promise.all(batch.map(async (num) => {
      if (ctrl.signal.aborted) return;
      try {
        const n   = String(num).padStart(4, '0');
        const res = await fetch(`${CDN}/${w.slug}/frame_${n}.webp`, {
          signal: ctrl.signal,
          cache:  'force-cache',
        });
        if (!res.ok) return;
        const bmp = await createImageBitmap(await res.blob());
        // Keep frames ordered by frame number
        const pos = st.frameNums.findIndex(x => x > num);
        if (pos === -1) { st.frameNums.push(num); st.frames.push(bmp); }
        else            { st.frameNums.splice(pos, 0, num); st.frames.splice(pos, 0, bmp); }
        if (idx === activeWorld) animDirty = true;
      } catch (e) { /* silently skip; AbortError or missing frame */ }
    }));

    // Hide loading overlay after first batch completes
    if (!firstReveal && st.frames.length >= Math.min(BG_BATCH, frameNums.length)) {
      firstReveal = true;
      if (idx === activeWorld) loadOverlay.classList.add('hidden');
    }

    if (i + BG_BATCH < frameNums.length && !ctrl.signal.aborted) {
      await new Promise(r => setTimeout(r, BG_DELAY));
    }
  }

  if (!ctrl.signal.aborted) { st.loadState = 'done'; updateDiag(); }
}

// ──────────────────────────────────────────────────────────────
// CURRENT VISUAL — best available for a world index
// ──────────────────────────────────────────────────────────────
function getBestVisual(idx) {
  const st = worldState[idx];
  if (st.frames.length > 0) return st.frames[st.animIdx % st.frames.length];
  return st.posterBmp || st.poster;
}

// ──────────────────────────────────────────────────────────────
// DRAW ACTIVE WORLD → canvas A
// ──────────────────────────────────────────────────────────────
function drawActiveWorld() {
  ctxA.clearRect(0, 0, canvasA.width, canvasA.height);
  drawCover(ctxA, getBestVisual(activeWorld));
}

// ──────────────────────────────────────────────────────────────
// SET ACCENT COLOR — CSS custom property + progress bar + accent bar
// ──────────────────────────────────────────────────────────────
function setAccent(idx) {
  const a = WORLDS[idx].accent;
  document.documentElement.style.setProperty('--accent', a);
  progBar.style.background = a;
}

// ──────────────────────────────────────────────────────────────
// WORLD SWITCH — coordinated crossfade
// Phase 0 (0ms):        Index updates, old info slides down
// Phase 1 (0–750ms):    Canvas-B fades in + scale(1.04→1.0)
// Phase 2 (~400ms):     Info text swaps; arrives from above
// Phase 3 (800ms):      Canvas-A inherits, B resets, old world evicted
// ──────────────────────────────────────────────────────────────
function switchWorld(idx) {
  if (idx === activeWorld || isTransition) return;
  const prev = activeWorld;
  isTransition = true;

  const w = WORLDS[idx];

  // Phase 0: draw incoming world on canvas-B; start fade-out of info
  ctxB.clearRect(0, 0, canvasB.width, canvasB.height);
  drawCover(ctxB, getBestVisual(idx));
  worldInfo.classList.add('switching');

  // Phase 0: index state and accent update immediately (crisp)
  indexBtns.forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.style.opacity = i === idx ? '1' : '0.4';
  });
  setAccent(idx);

  // Phase 1 (next paint): trigger canvas-B CSS transition
  requestAnimationFrame(() => requestAnimationFrame(() => {
    canvasB.classList.add('transitioning');
  }));

  // Phase 2 (~55% of transition): swap info text with arrive-from-above animation
  setTimeout(() => {
    wiName.textContent = w.name;
    wiCur.textContent  = String(idx + 1).padStart(2, '0');
    // Snap to above-and-hidden, then let normal transition settle it
    worldInfo.classList.remove('switching');
    worldInfo.classList.add('arriving');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      worldInfo.classList.remove('arriving');
    }));
  }, Math.round(TRANSITION_MS * 0.55));

  // Phase 3: complete — swap canvases, evict old world, start new load
  setTimeout(() => {
    ctxA.clearRect(0, 0, canvasA.width, canvasA.height);
    ctxA.drawImage(canvasB, 0, 0);
    canvasB.classList.remove('transitioning');
    ctxB.clearRect(0, 0, canvasB.width, canvasB.height);

    // Evict previous world: close all decoded ImageBitmaps
    evictWorld(prev);

    activeWorld  = idx;
    isTransition = false;
    animDirty    = true;

    // Begin loading new active world's frame sequence
    loadWorldFrames(idx);
    updateDiag();
  }, TRANSITION_MS + 60);
}

// ──────────────────────────────────────────────────────────────
// CURSOR
// ──────────────────────────────────────────────────────────────
const cDot  = document.getElementById('c-dot');
const cRing = document.getElementById('c-ring');
let mX = 0, mY = 0, rX = 0, rY = 0;
if (!isMob) {
  document.addEventListener('mousemove', e => {
    mX = e.clientX; mY = e.clientY;
    cDot.style.left = mX + 'px'; cDot.style.top = mY + 'px';
    tPX = ((mX / W) - 0.5) * PARALLAX_AMP_X;
    tPY = ((mY / H) - 0.5) * PARALLAX_AMP_Y;
  });
  document.addEventListener('mouseleave', () => { tPX = 0; tPY = 0; });
  indexBtns.forEach(el => {
    el.addEventListener('mouseenter', () => cRing.classList.add('expand'));
    el.addEventListener('mouseleave', () => cRing.classList.remove('expand'));
  });
}

// ──────────────────────────────────────────────────────────────
// ANIMATION LOOP — unified RAF tick
// ──────────────────────────────────────────────────────────────
let fpsTime = 0, fpsCnt = 0, fpsDisplay = 0;

function tick(ts) {
  requestAnimationFrame(tick);
  const dt = Math.min(ts - lastTs, 80);
  lastTs = ts;

  // 1. Cursor ring lerp
  if (!isMob) {
    rX += (mX - rX) * 0.13; rY += (mY - rY) * 0.13;
    cRing.style.left = rX + 'px'; cRing.style.top = rY + 'px';
  }

  // 2. Parallax lerp — threshold-gated to prevent micro-jitter
  if (!isMob) {
    cPX += (tPX - cPX) * PARALLAX_K;
    cPY += (tPY - cPY) * PARALLAX_K;
    if (Math.abs(cPX - lPX) > PARALLAX_THR || Math.abs(cPY - lPY) > PARALLAX_THR) {
      lPX = cPX; lPY = cPY;
      animDirty = true;
    }
  }

  // 3. Ambient frame advance — only when not transitioning
  const st = worldState[activeWorld];
  if (st.frames.length > 1 && !isTransition) {
    frameTimer += dt;
    if (frameTimer >= FRAME_INTERVAL) {
      frameTimer %= FRAME_INTERVAL;
      st.animIdx = (st.animIdx + 1) % st.frames.length;
      animDirty = true;
    }
  }

  // 4. Redraw only when something changed
  if (animDirty && !isTransition) {
    drawActiveWorld();
    animDirty = false;
  }

  // 5. Progress bar: position in animation loop
  if (!isTransition && st.frames.length > 1) {
    const pct = ((st.animIdx + 1) / st.frames.length) * 100;
    progBar.style.width = pct + '%';
  }

  // 6. FPS counter (diag only)
  if (showDiag) {
    fpsCnt++;
    if (ts - fpsTime >= 1000) {
      fpsDisplay = fpsCnt; fpsCnt = 0; fpsTime = ts;
      updateDiag();
    }
  }
}

requestAnimationFrame(tick);

// ──────────────────────────────────────────────────────────────
// DIAGNOSTIC UPDATE
// ──────────────────────────────────────────────────────────────
function updateDiag() {
  if (!showDiag) return;
  const st    = worldState[activeWorld];
  const total = WORLDS.reduce((s, _, i) => s + worldState[i].frames.length, 0);

  document.getElementById('d-fps').textContent = `fps: ${fpsDisplay}`;
  document.getElementById('d-frames').textContent =
    `frames: ${st.frames.length} / ${PREVIEW_CAP}  stride: ${Math.max(1,Math.floor(WORLDS[activeWorld].frameCount/PREVIEW_CAP))}`;
  document.getElementById('d-mem').textContent =
    `decoded total: ${total}  (~${Math.round(total * 8)}MB)`;

  const lines = WORLDS.map((w, i) => {
    const s   = worldState[i];
    const p   = s.posterOK === true ? '✓' : s.posterOK === false ? '✗' : '…';
    const f   = s.frames.length;
    const act = i === activeWorld ? '▶' : ' ';
    return `${act} ${w.slug}  poster:${p}  frames:${f}`;
  });
  document.getElementById('d-worlds').textContent = lines.join('\n');
}

// ──────────────────────────────────────────────────────────────
// INDEX INTERACTIONS
// ──────────────────────────────────────────────────────────────
indexBtns.forEach((el, i) => {
  el.style.opacity = i === 0 ? '1' : '0.4';
  el.addEventListener('click', () => switchWorld(i));
});

// Mobile swipe on index bar
let touchX0 = 0;
document.getElementById('world-index').addEventListener('touchstart', e => {
  touchX0 = e.touches[0].clientX;
}, { passive: true });
document.getElementById('world-index').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX0;
  if (Math.abs(dx) < 36) return; // not a swipe
  const dir  = dx < 0 ? 1 : -1;
  const next = Math.max(0, Math.min(WORLDS.length - 1, activeWorld + dir));
  switchWorld(next);
}, { passive: true });

// ──────────────────────────────────────────────────────────────
// WORLDS SECTION REVEAL
// ──────────────────────────────────────────────────────────────
const section = document.getElementById('worlds-section');
new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting && !section.classList.contains('is-revealed')) {
      section.classList.add('is-revealed');
      // Trigger info "arrive from above" on initial reveal
      setTimeout(() => {
        worldInfo.classList.add('arriving');
        requestAnimationFrame(() => requestAnimationFrame(() => {
          worldInfo.classList.remove('arriving');
        }));
      }, 280);
      // Begin loading active world
      loadWorldFrames(activeWorld);
    }
  });
}, { threshold: 0.12 }).observe(section);

// ──────────────────────────────────────────────────────────────
// INITIAL STATE
// ──────────────────────────────────────────────────────────────
setAccent(0);

</script>
</body>
</html>
