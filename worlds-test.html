<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selected Worlds — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,200;0,300;0,400;0,500;1,200;1,300&family=Inter:wght@300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>

/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:        #06050c;
  --ink:       rgba(255,255,255,0.90);
  --ink-dim:   rgba(255,255,255,0.40);
  --ink-mute:  rgba(255,255,255,0.16);
  --ink-ghost: rgba(255,255,255,0.05);
  --accent:    #c46428;

  --f-display: 'Inter Tight', sans-serif;
  --f-body:    'Inter', sans-serif;
  --f-mono:    'DM Mono', monospace;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-cin: cubic-bezier(0.16, 1, 0.3, 1);

  --transition-ms: 550ms;
}

/* ── RESET ──────────────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; scroll-behavior: auto; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-weight: 300;
  overflow-x: hidden;
  cursor: none;
  -webkit-font-smoothing: antialiased;
}
@media (hover:none),(pointer:coarse) { body { cursor: auto; } }

/* ── CURSOR ─────────────────────────────────────────────── */
#c-dot, #c-ring {
  position: fixed; top: 0; left: 0;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%);
  will-change: transform;
}
#c-dot {
  width: 5px; height: 5px;
  background: var(--ink);
  border-radius: 50%;
  mix-blend-mode: difference;
}
#c-ring {
  width: 28px; height: 28px;
  border: 1px solid rgba(255,255,255,0.45);
  border-radius: 50%;
  transition: transform 0.22s var(--ease-out), border-color 0.22s;
}
#c-ring.expand {
  transform: translate(-50%,-50%) scale(1.65);
  border-color: var(--accent);
}
@media (hover:none),(pointer:coarse) { #c-dot, #c-ring { display: none; } }

/* ═══════════════════════════════════════════════════════════ */
/* SEQ1 PROXY — PROTOTYPE SCAFFOLD ONLY                       */
/* In production: actual Sequence1 scroll experience.         */
/* ═══════════════════════════════════════════════════════════ */
#seq1-proxy {
  position: relative;
  height: 100vh;
  background: var(--bg);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
}
#seq1-proxy::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 80px;
  background: linear-gradient(transparent, var(--bg));
  z-index: 2;
  pointer-events: none;
}
.seq1-bg {
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 90% 70% at 40% 60%, rgba(18,14,28,0.95) 0%, rgba(6,5,12,0.98) 70%),
    radial-gradient(ellipse 60% 80% at 70% 25%, rgba(10,8,20,0.9) 0%, transparent 65%);
}
.seq1-scaffold-label {
  position: absolute;
  top: 28px; left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  text-align: center;
  pointer-events: none;
}
.seq1-scaffold-label span {
  display: block;
  font-family: var(--f-mono);
  font-size: 8px; font-weight: 300;
  letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--ink-mute);
}
.seq1-scaffold-label strong {
  display: block;
  font-family: var(--f-mono);
  font-size: 7px; font-weight: 300;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(255,255,255,0.1);
  margin-top: 6px;
}
.seq1-scroll-hint {
  position: relative; z-index: 3;
  margin-bottom: 60px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  opacity: 0.28;
}
.seq1-scroll-hint span {
  font-family: var(--f-mono); font-size: 8px; font-weight: 300;
  letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink);
}
.seq1-scroll-line {
  width: 1px; height: 36px;
  background: linear-gradient(transparent, var(--ink));
  animation: scroll-pulse 2s ease-in-out infinite;
}
@keyframes scroll-pulse {
  0%, 100% { opacity: 0.3; transform: scaleY(0.5) translateY(-6px); }
  55%       { opacity: 1;   transform: scaleY(1) translateY(0); }
}

/* ═══════════════════════════════════════════════════════════ */
/* WORLDS SECTION                                             */
/* ═══════════════════════════════════════════════════════════ */
#worlds-section {
  position: relative;
  height: 100vh;
  overflow: hidden;
  opacity: 0;
  background: var(--bg);
}
#worlds-section.is-revealed {
  opacity: 1;
  transition: opacity 1s var(--ease-out);
}

/* ── POSTER IMAGES (replaces canvas) ────────────────────── */
/*                                                            */
/* Five <img> elements stack absolutely, one per world.       */
/* Only the active world has opacity:1. CSS transitions       */
/* handle the crossfade — GPU-composited, no JS animation.    */
/* Rapid clicks work because CSS handles concurrent fades.    */
/*                                                            */
.world-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  opacity: 0;
  transition: opacity var(--transition-ms) var(--ease-out);
  will-change: opacity;
  z-index: 1;
  /* block CLS flash; background shows --bg until img loads */
  background: var(--bg);
}
.world-bg.active {
  opacity: 1;
}
/* While loading: pulse the active slot so the screen is never silent */
.world-bg.active.loading {
  animation: poster-pulse 1.8s ease-in-out infinite;
}
@keyframes poster-pulse {
  0%, 100% { opacity: 0.0; }
  50%       { opacity: 0.08; }
}

/* ── OVERLAYS ────────────────────────────────────────────── */
#worlds-vignette {
  position: absolute; inset: 0; z-index: 5; pointer-events: none;
  background:
    radial-gradient(ellipse 75% 75% at 50% 50%, transparent 38%, rgba(6,5,12,0.5) 100%),
    linear-gradient(180deg, rgba(6,5,12,0.38) 0%, transparent 20%, transparent 62%, rgba(6,5,12,0.88) 100%),
    linear-gradient(90deg, rgba(6,5,12,0.28) 0%, transparent 14%, transparent 86%, rgba(6,5,12,0.28) 100%);
}
#worlds-grain {
  position: absolute; inset: 0; z-index: 6; pointer-events: none;
  opacity: 0.022;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
  animation: grain 0.5s steps(1) infinite;
}
@keyframes grain {
  0%  { background-position:   0   0; }
  20% { background-position: -42px  18px; }
  40% { background-position:  58px -28px; }
  60% { background-position: -18px  52px; }
  80% { background-position:  32px -12px; }
}

/* ── WORLD INFO ─────────────────────────────────────────── */
#world-info {
  position: absolute;
  bottom: 88px; left: 44px;
  z-index: 10;
  pointer-events: none;
  transition: transform 0.48s var(--ease-out), opacity 0.48s var(--ease-out);
}
#world-info.switching {
  transform: translateY(12px);
  opacity: 0;
}
#world-info.arriving {
  transform: translateY(-14px);
  opacity: 0;
  transition: none;
}

.wi-frac {
  font-family: var(--f-mono);
  font-size: 9px; font-weight: 300; letter-spacing: 0.24em;
  color: var(--ink-mute);
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.wi-frac-sep { width: 18px; height: 1px; background: var(--ink-mute); }

.wi-name {
  font-family: var(--f-display);
  font-size: clamp(2.2rem, 3.6vw, 3.8rem);
  font-weight: 300;
  letter-spacing: -0.015em;
  line-height: 1;
  color: var(--ink);
  margin-bottom: 10px;
  position: relative;
}
.wi-name::before {
  content: '';
  position: absolute;
  left: -15px; top: 8%; bottom: 8%;
  width: 2px;
  background: var(--accent);
  border-radius: 1px;
  transition: background 0.65s var(--ease-out);
}

.wi-tag {
  font-family: var(--f-mono);
  font-size: 9px; font-weight: 300; letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

/* ── WORLD INDEX ─────────────────────────────────────────── */
#world-index {
  position: absolute;
  bottom: 28px; right: 36px;
  z-index: 10;
  display: flex;
  align-items: flex-end;
  gap: 0;
}

.wi-btn {
  position: relative;
  display: flex; flex-direction: column;
  align-items: flex-start; gap: 5px;
  padding: 12px 13px 10px;
  cursor: pointer;
  background: transparent; border: none;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  transition: opacity 0.3s var(--ease-out);
}
.wi-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 13px; right: 13px;
  height: 1px;
  background: var(--ink-ghost);
  transition: background 0.4s var(--ease-out);
}
.wi-btn.active::before {
  background: var(--accent);
  transition: background 0.65s var(--ease-out);
}
.wi-btn:hover::before { background: rgba(255,255,255,0.15); }
.wi-btn.active:hover::before { background: var(--accent); }

.wi-btn-num {
  font-family: var(--f-mono);
  font-size: 8px; font-weight: 300; letter-spacing: 0.2em;
  color: var(--ink-mute);
  transition: color 0.35s;
}
.wi-btn.active .wi-btn-num { color: var(--accent); }

.wi-btn-name {
  font-family: var(--f-display);
  font-size: 10px; font-weight: 400; letter-spacing: 0.05em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.22);
  transition: color 0.35s;
  white-space: nowrap;
}
.wi-btn.active .wi-btn-name { color: rgba(255,255,255,0.75); }

/* Mobile */
@media (max-width: 768px) {
  #world-index {
    left: 0; right: 0; bottom: 0;
    justify-content: stretch;
    background: linear-gradient(transparent, rgba(6,5,12,0.75));
    padding-bottom: env(safe-area-inset-bottom, 12px);
  }
  .wi-btn { flex: 1; align-items: center; padding: 10px 4px 8px; }
  .wi-btn::before { left: 4px; right: 4px; }
  .wi-btn-name { font-size: 8px; }
  #world-info { left: 20px; bottom: 100px; }
  .wi-name { font-size: clamp(1.8rem, 6vw, 3rem); }
}

/* ── PROGRESS BAR ────────────────────────────────────────── */
#worlds-progress {
  position: absolute; top: 0; left: 0;
  height: 1px; z-index: 11;
  background: var(--accent);
  width: 0%;
  transition: background 0.65s var(--ease-out);
  opacity: 0.5;
  pointer-events: none;
}

/* ── DIAGNOSTIC PANEL ────────────────────────────────────── */
#diag-panel {
  position: absolute;
  top: 16px; left: 16px;
  z-index: 12;
  font-family: var(--f-mono);
  font-size: 8px; font-weight: 300; letter-spacing: 0.18em;
  color: rgba(255,255,255,0.55);
  pointer-events: none;
  text-transform: none;
  line-height: 1.85;
  display: none;
  background: rgba(6,5,12,0.72);
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,0.08);
  max-width: 520px;
  white-space: pre;
}
body.show-diag #diag-panel { display: block; }
body.show-diag #world-info { bottom: 148px; }

/* ── AFTER-WORLDS ─────────────────────────────────────────── */
#after-worlds {
  height: 55vh;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  border-top: 1px solid var(--ink-ghost);
}
.aw-label {
  font-family: var(--f-mono);
  font-size: 8px; font-weight: 300; letter-spacing: 0.28em;
  color: var(--ink-mute); text-transform: uppercase; text-align: center;
}

/* ── PROTO BADGE ─────────────────────────────────────────── */
#proto-badge {
  position: fixed; top: 18px; right: 18px; z-index: 9990;
  font-family: var(--f-mono); font-size: 7px; font-weight: 300;
  letter-spacing: 0.22em; color: var(--ink-mute); text-transform: uppercase;
  background: rgba(6,5,12,0.65); padding: 5px 9px;
  border: 1px solid var(--ink-ghost);
  pointer-events: none;
}

</style>
</head>
<body>

<div id="c-dot"></div>
<div id="c-ring"></div>
<div id="proto-badge">worlds-test · poster phase</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- PROTOTYPE SCAFFOLD — NOT IN PRODUCTION                     -->
<!-- Production flow: Sequence1 scroll → Selected Worlds.       -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div id="seq1-proxy">
  <div class="seq1-bg"></div>
  <div class="seq1-scaffold-label">
    <span>Sequence 01</span>
    <strong>[ prototype scaffold — not in production ]</strong>
  </div>
  <div class="seq1-scroll-hint">
    <span>Scroll</span>
    <div class="seq1-scroll-line"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- WORLDS SECTION                                             -->
<!-- ═══════════════════════════════════════════════════════════ -->
<section id="worlds-section" aria-label="Selected Worlds">

  <!--
    One <img> per world. All load immediately in parallel.
    CSS opacity transition handles crossfade — no canvas, no JS animation.
    The active world has class "active" (opacity:1). Others are opacity:0.
    "loading" class is removed when the img fires onload.
  -->
  <img class="world-bg active loading" id="bg-0" alt="" draggable="false">
  <img class="world-bg        loading" id="bg-1" alt="" draggable="false">
  <img class="world-bg        loading" id="bg-2" alt="" draggable="false">
  <img class="world-bg        loading" id="bg-3" alt="" draggable="false">
  <img class="world-bg        loading" id="bg-4" alt="" draggable="false">

  <div id="worlds-vignette"></div>
  <div id="worlds-grain"></div>

  <!-- World identity — bottom-left -->
  <div id="world-info">
    <div class="wi-frac">
      <span id="wi-cur">01</span>
      <span class="wi-frac-sep"></span>
      <span>05</span>
    </div>
    <div class="wi-name" id="wi-name">Ashfall</div>
    <div class="wi-tag">Environment</div>
  </div>

  <!-- World index — bottom-right -->
  <nav id="world-index" aria-label="Select world">
    <button class="wi-btn active" data-w="0" aria-label="World 01 Ashfall">
      <span class="wi-btn-num">01</span>
      <span class="wi-btn-name">Ashfall</span>
    </button>
    <button class="wi-btn" data-w="1" aria-label="World 02 Luminara">
      <span class="wi-btn-num">02</span>
      <span class="wi-btn-name">Luminara</span>
    </button>
    <button class="wi-btn" data-w="2" aria-label="World 03 Verdant">
      <span class="wi-btn-num">03</span>
      <span class="wi-btn-name">Verdant</span>
    </button>
    <button class="wi-btn" data-w="3" aria-label="World 04 Helios">
      <span class="wi-btn-num">04</span>
      <span class="wi-btn-name">Helios</span>
    </button>
    <button class="wi-btn" data-w="4" aria-label="World 05 Aurum">
      <span class="wi-btn-num">05</span>
      <span class="wi-btn-name">Aurum</span>
    </button>
  </nav>

  <div id="worlds-progress"></div>

  <!-- Diagnostic panel: visible via ?diag=1 -->
  <pre id="diag-panel"></pre>

</section>

<div id="after-worlds">
  <div class="aw-label">
    Commercial CGI &nbsp;·&nbsp; Character &nbsp;·&nbsp; Transformations
    <span style="display:block;margin-top:7px;font-size:7px;opacity:0.45">[Following sections — not built yet]</span>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- ENGINE                                                     -->
<!-- ═══════════════════════════════════════════════════════════ -->
<script>
'use strict';

// ──────────────────────────────────────────────────────────────
// WORLD DATA
// ──────────────────────────────────────────────────────────────
const CDN = 'https://pub-88341f47988743aba3154d2af5c6327e.r2.dev';

/*
  posterCandidates: ordered list of frame filenames to try.
  If the first URL returns a 404 / network error, the next is tried.

  world-01 (sourceStart:1): UE5 render started at frame 1.
  world-02 (sourceStart:0): UE5 render started at frame 0 → frame_0000.webp first.
  world-03 (sourceStart:0): frame_0061.webp confirmed working in production.
  world-04 (sourceStart:4): UE5 render started at frame 4 → frame_0004.webp first.
  world-05 (sourceStart:0): UE5 render started at frame 0 → frame_0000.webp first.
*/
const WORLDS = [
  {
    slug: 'world-01', name: 'Ashfall',  accent: '#c46428',
    posterCandidates: ['frame_0001.webp', 'frame_0002.webp', 'frame_0003.webp'],
  },
  {
    slug: 'world-02', name: 'Luminara', accent: '#7c5cc4',
    posterCandidates: ['frame_0000.webp', 'frame_0001.webp', 'frame_0002.webp'],
  },
  {
    slug: 'world-03', name: 'Verdant',  accent: '#3a8c52',
    posterCandidates: ['frame_0061.webp', 'frame_0001.webp', 'frame_0000.webp'],
  },
  {
    slug: 'world-04', name: 'Helios',   accent: '#2872c4',
    posterCandidates: ['frame_0004.webp', 'frame_0005.webp', 'frame_0001.webp'],
  },
  {
    slug: 'world-05', name: 'Aurum',    accent: '#c4a028',
    posterCandidates: ['frame_0000.webp', 'frame_0001.webp', 'frame_0002.webp'],
  },
];

// ──────────────────────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────────────────────
let activeWorld = 0;

// Per-world load tracking for diagnostics
const worldDiag = WORLDS.map((w, i) => ({
  triedIdx:   0,         // which candidate index is currently being tried
  triedUrl:   '',        // full URL requested
  status:     'pending', // pending | loading | ok | error | all-failed
  naturalW:   0,
  naturalH:   0,
  errorCount: 0,
}));

// ──────────────────────────────────────────────────────────────
// DOM REFS
// ──────────────────────────────────────────────────────────────
const bgImgs     = WORLDS.map((_, i) => document.getElementById(`bg-${i}`));
const worldInfo  = document.getElementById('world-info');
const wiName     = document.getElementById('wi-name');
const wiCur      = document.getElementById('wi-cur');
const progBar    = document.getElementById('worlds-progress');
const indexBtns  = [...document.querySelectorAll('.wi-btn')];
const diagPanel  = document.getElementById('diag-panel');
const section    = document.getElementById('worlds-section');

const showDiag = location.search.includes('diag=1');
if (showDiag) document.body.classList.add('show-diag');

// ──────────────────────────────────────────────────────────────
// POSTER LOADING — one img per world, all start immediately
//
// Each img tries posterCandidates[0] first. On error it tries
// the next candidate. This handles worlds where the first frame
// number doesn't exist on R2 (e.g. world-04 starts at frame 4).
// ──────────────────────────────────────────────────────────────
function tryPoster(idx, candidateIdx) {
  const w    = WORLDS[idx];
  const img  = bgImgs[idx];
  const diag = worldDiag[idx];

  if (candidateIdx >= w.posterCandidates.length) {
    diag.status = 'all-failed';
    console.error(`[worlds] ${w.slug} ALL poster candidates failed`);
    img.classList.remove('loading');
    updateDiag();
    return;
  }

  const filename = w.posterCandidates[candidateIdx];
  const url      = `${CDN}/${w.slug}/${filename}`;
  diag.triedIdx  = candidateIdx;
  diag.triedUrl  = url;
  diag.status    = 'loading';
  console.log(`[worlds] ${w.slug} trying poster [${candidateIdx}]: ${url}`);
  updateDiag();

  img.onload = () => {
    diag.status   = 'ok';
    diag.naturalW = img.naturalWidth;
    diag.naturalH = img.naturalHeight;
    img.classList.remove('loading');
    console.log(`[worlds] ${w.slug} poster OK: ${filename}  ${img.naturalWidth}×${img.naturalHeight}`);
    updateDiag();
  };

  img.onerror = () => {
    diag.errorCount++;
    console.warn(`[worlds] ${w.slug} poster FAILED [${candidateIdx}]: ${url}`);
    // Try next candidate
    tryPoster(idx, candidateIdx + 1);
  };

  img.src = url;
}

// Start all 5 poster loads immediately, in parallel
WORLDS.forEach((_, i) => tryPoster(i, 0));

// ──────────────────────────────────────────────────────────────
// ACCENT COLOR
// ──────────────────────────────────────────────────────────────
function setAccent(idx) {
  document.documentElement.style.setProperty('--accent', WORLDS[idx].accent);
  progBar.style.background = WORLDS[idx].accent;
}

// ──────────────────────────────────────────────────────────────
// WORLD SWITCH — CSS crossfade only
//
// Rapid clicks: safe. We just move the 'active' class.
// CSS handles concurrent opacity transitions gracefully.
// No lock, no canvas, no ImageBitmap required.
// ──────────────────────────────────────────────────────────────
function switchWorld(idx) {
  if (idx === activeWorld) return;

  const prev = activeWorld;
  activeWorld = idx;
  const w = WORLDS[idx];

  // 1. Update accent immediately
  setAccent(idx);

  // 2. Update index buttons immediately
  indexBtns.forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  // 3. Crossfade: deactivate prev, activate next
  bgImgs[prev].classList.remove('active');
  bgImgs[idx].classList.add('active');

  // 4. Info text: slide down, swap, arrive from above
  worldInfo.classList.add('switching');
  setTimeout(() => {
    wiName.textContent = w.name;
    wiCur.textContent  = String(idx + 1).padStart(2, '0');
    worldInfo.classList.remove('switching');
    worldInfo.classList.add('arriving');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      worldInfo.classList.remove('arriving');
    }));
  }, 260); // ~47% of 550ms transition

  updateDiag();
}

// ──────────────────────────────────────────────────────────────
// INDEX INTERACTIONS
// ──────────────────────────────────────────────────────────────
indexBtns.forEach((el, i) => {
  el.addEventListener('click', () => switchWorld(i));
});

// Mobile swipe
let touchX0 = 0;
document.getElementById('world-index').addEventListener('touchstart', e => {
  touchX0 = e.touches[0].clientX;
}, { passive: true });
document.getElementById('world-index').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX0;
  if (Math.abs(dx) < 36) return;
  const dir  = dx < 0 ? 1 : -1;
  const next = Math.max(0, Math.min(WORLDS.length - 1, activeWorld + dir));
  switchWorld(next);
}, { passive: true });

// ──────────────────────────────────────────────────────────────
// SECTION REVEAL — IntersectionObserver
// ──────────────────────────────────────────────────────────────
new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting && !section.classList.contains('is-revealed')) {
      section.classList.add('is-revealed');
      // Info arrive-from-above on reveal
      setTimeout(() => {
        worldInfo.classList.add('arriving');
        requestAnimationFrame(() => requestAnimationFrame(() => {
          worldInfo.classList.remove('arriving');
        }));
      }, 280);
    }
  });
}, { threshold: 0.12 }).observe(section);

// ──────────────────────────────────────────────────────────────
// CURSOR — minimal RAF tick (cursor ring lerp only)
// ──────────────────────────────────────────────────────────────
const cDot  = document.getElementById('c-dot');
const cRing = document.getElementById('c-ring');
const isMob = matchMedia('(hover:none),(pointer:coarse)').matches;
let mX = 0, mY = 0, rX = 0, rY = 0;

if (!isMob) {
  document.addEventListener('mousemove', e => {
    mX = e.clientX; mY = e.clientY;
    cDot.style.left = mX + 'px'; cDot.style.top = mY + 'px';
  });
  indexBtns.forEach(el => {
    el.addEventListener('mouseenter', () => cRing.classList.add('expand'));
    el.addEventListener('mouseleave', () => cRing.classList.remove('expand'));
  });

  (function tick() {
    requestAnimationFrame(tick);
    rX += (mX - rX) * 0.13;
    rY += (mY - rY) * 0.13;
    cRing.style.left = rX + 'px';
    cRing.style.top  = rY + 'px';
  })();
}

// ──────────────────────────────────────────────────────────────
// INITIAL STATE
// ──────────────────────────────────────────────────────────────
setAccent(0);

// ──────────────────────────────────────────────────────────────
// DIAGNOSTIC UPDATE
// ──────────────────────────────────────────────────────────────
function updateDiag() {
  if (!showDiag) return;

  const lines = [
    `worlds-test — poster phase (no animation)`,
    `active world: ${activeWorld} — ${WORLDS[activeWorld].name}`,
    ``,
    `WORLD  SLUG       STATUS       URL TRIED`,
  ];

  WORLDS.forEach((w, i) => {
    const d   = worldDiag[i];
    const act = i === activeWorld ? '▶' : ' ';
    const st  = d.status.padEnd(11);
    const res = d.status === 'ok'
      ? `${w.posterCandidates[d.triedIdx]}  ${d.naturalW}×${d.naturalH}`
      : d.status === 'all-failed'
        ? 'ALL CANDIDATES FAILED'
        : d.triedUrl
          ? `${w.posterCandidates[d.triedIdx]}  (trying…)`
          : '—';
    lines.push(`${act} ${String(i+1).padStart(2,'0')}   ${w.slug}   ${st}  ${res}`);
    if (d.errorCount > 0 && d.status !== 'ok' && d.status !== 'all-failed') {
      const tried = w.posterCandidates.slice(0, d.triedIdx).join(', ');
      if (tried) lines.push(`         failed: ${tried}`);
    }
  });

  lines.push(``);
  lines.push(`img.src set immediately for all 5 worlds (no setTimeout delay)`);
  lines.push(`transition: CSS opacity ${getComputedStyle(document.documentElement)
    .getPropertyValue('--transition-ms').trim()} — no canvas, no ImageBitmap`);

  diagPanel.textContent = lines.join('\n');
}

updateDiag();
// Refresh diag every 1.5s while posters are still loading
const diagInterval = setInterval(() => {
  updateDiag();
  const allDone = worldDiag.every(d => d.status === 'ok' || d.status === 'all-failed');
  if (allDone) clearInterval(diagInterval);
}, 1500);

</script>
</body>
</html>
