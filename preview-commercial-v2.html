<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial CGI — Design Preview v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #06050c;
  --bg-1:     #0b0a14;
  --bg-2:     #100f1c;
  --ink:      rgba(255,255,255,.92);
  --ink-dim:  rgba(255,255,255,.45);
  --ink-mute: rgba(255,255,255,.20);
  --ink-ghost:rgba(255,255,255,.06);
  --accent:   #e8d5b0;
  --f-display:'Inter Tight',sans-serif;
  --f-mono:   'DM Mono',monospace;
  --ease-out: cubic-bezier(.23,1,.32,1);
  --ease-snap:cubic-bezier(.16,1,.3,1);

  /* Player height drives everything */
  --player-h: 62vh;
  --player-w: calc(var(--player-h) * 9 / 16);
  /* Adjacent peek width */
  --peek-w: calc(var(--player-w) * 0.28);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);color:var(--ink);font-family:var(--f-display);}
body{min-height:100vh;overflow-x:hidden;}
::selection{background:var(--accent);color:#06050c;}

/* ── PAGE HEADER ── */
.page-header {
  padding: 56px 64px 24px;
  border-bottom: 1px solid var(--ink-ghost);
  display: flex; justify-content: space-between; align-items: flex-end;
}
.page-label { font-family:var(--f-mono); font-size:10px; letter-spacing:.4em; text-transform:uppercase; color:var(--ink-dim); }
.page-note  { font-family:var(--f-mono); font-size:10px; color:var(--ink-mute); letter-spacing:.15em; }

/* ── SECTION ── */
.section { padding: 64px 0 80px; }
.section-head {
  padding: 0 64px;
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 56px;
}
.section-title { font-family:var(--f-display); font-weight:200; font-size:clamp(28px,3.5vw,48px); letter-spacing:-0.02em; }
.section-meta  { font-family:var(--f-mono); font-size:10px; color:var(--ink-dim); letter-spacing:.3em; text-transform:uppercase; }

/* ── SCREENING ROOM ── */
.screening-room {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: var(--player-h);
  overflow: hidden;
  gap: 0;
}

/* Side fade masks */
.screening-room::before,
.screening-room::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 80px;
  z-index: 10;
  pointer-events: none;
}
.screening-room::before { left:0; background: linear-gradient(to right, var(--bg) 30%, transparent); }
.screening-room::after  { right:0; background: linear-gradient(to left,  var(--bg) 30%, transparent); }

/* ── FILM TRACK ── */
.film-track {
  position: absolute;
  display: flex;
  align-items: center;
  height: 100%;
  left: 50%;
  transform: translateX(0);
  transition: transform 0.55s var(--ease-snap);
  gap: 16px;
}

/* ── FILM CARD ── */
.film-card {
  flex-shrink: 0;
  position: relative;
  width: var(--player-w);
  height: var(--player-h);
  cursor: pointer;
  overflow: hidden;
  background: var(--bg-2);
  transition: opacity 0.5s var(--ease-out);
  border: 1px solid var(--ink-ghost);
}
.film-card.active {
  border-color: rgba(232,213,176,.25);
  cursor: default;
}
.film-card video,
.film-card .poster-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
  background: var(--bg-2);
}
/* Active card: scan-line overlay */
.film-card.active::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,.04) 3px,
    rgba(0,0,0,.04) 4px
  );
  pointer-events: none;
  z-index: 2;
}
.film-card-overlay {
  position: absolute;
  inset: 0;
  background: rgba(6,5,12,.5);
  z-index: 3;
  transition: opacity 0.4s;
  pointer-events: none;
}
.film-card.active .film-card-overlay { opacity: 0; }

/* Film number badge */
.film-num-badge {
  position: absolute;
  top: 12px; left: 12px;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .25em;
  color: var(--accent);
  z-index: 4;
  opacity: 0.85;
}
.film-num-badge.inactive { color: var(--ink-mute); }

/* ── PLAYER CHROME (overlays on active card) ── */
.player-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 12px 14px;
  z-index: 5;
  background: linear-gradient(to bottom, rgba(6,5,12,.8) 0%, transparent 100%);
  opacity: 0;
  transition: opacity 0.3s;
}
.film-card.active .player-top { opacity: 1; }
.film-cat-badge {
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--ink-dim);
  padding: 4px 8px;
  border: 1px solid var(--ink-ghost);
  background: rgba(6,5,12,.7);
  backdrop-filter: blur(8px);
}
.film-index-badge {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .2em;
  color: var(--ink-dim);
}

.player-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 12px 14px;
  z-index: 5;
  background: linear-gradient(to top, rgba(6,5,12,.85) 0%, transparent 100%);
  opacity: 0;
  transition: opacity 0.3s;
}
.film-card.active .player-bottom { opacity: 1; }
.film-title-player {
  font-family: var(--f-display);
  font-weight: 200;
  font-size: clamp(14px, 1.2vw, 20px);
  letter-spacing: -0.01em;
  color: var(--ink);
}
.sound-btn {
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--ink-dim);
  background: rgba(6,5,12,.7);
  border: 1px solid var(--ink-ghost);
  backdrop-filter: blur(8px);
  padding: 5px 10px;
  cursor: pointer;
  transition: color .2s, border-color .2s;
}
.sound-btn:hover { color: var(--ink); border-color: var(--accent); }
.sound-btn.on { color: var(--accent); border-color: var(--accent); }

/* ── FILM NAME (below player, outside card) ── */
.player-label-area {
  margin-top: 24px;
  padding: 0 64px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.player-film-name {
  font-family: var(--f-display);
  font-weight: 200;
  font-size: clamp(20px, 2.2vw, 32px);
  letter-spacing: -0.02em;
  color: var(--ink);
  transition: opacity 0.4s;
}
.player-film-counter {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .3em;
  color: var(--ink-dim);
}

/* ── FILM INDEX TABLE ── */
.film-index-section {
  margin-top: 40px;
  padding: 0 64px;
  border-top: 1px solid var(--ink-ghost);
}
.film-index-row {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--ink-ghost);
  cursor: pointer;
  gap: 24px;
  transition: background 0.2s;
  position: relative;
}
.film-index-row::before {
  content: '';
  position: absolute;
  left: -64px;
  right: -64px;
  top: 0; bottom: 0;
  background: transparent;
  transition: background 0.2s;
  pointer-events: none;
}
.film-index-row:hover::before { background: var(--ink-ghost); }
.film-index-row.active::before { background: rgba(232,213,176,.04); }
.film-row-num {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .25em;
  color: var(--ink-mute);
  min-width: 28px;
  flex-shrink: 0;
}
.film-index-row.active .film-row-num { color: var(--accent); }
.film-row-name {
  font-family: var(--f-display);
  font-weight: 300;
  font-size: 15px;
  letter-spacing: -0.01em;
  color: var(--ink-dim);
  flex: 1;
  transition: color 0.2s;
}
.film-index-row.active .film-row-name,
.film-index-row:hover .film-row-name { color: var(--ink); }
.film-row-cat {
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--ink-mute);
  flex-shrink: 0;
  transition: color 0.2s;
}
.film-index-row.active .film-row-cat { color: var(--ink-dim); }
.film-row-indicator {
  width: 16px; height: 2px;
  background: var(--ink-ghost);
  flex-shrink: 0;
  transition: background 0.2s, width 0.3s;
}
.film-index-row.active .film-row-indicator { background: var(--accent); width: 32px; }

/* ── LOADING ── */
.film-loader {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 6;
  background: var(--bg-2);
  transition: opacity 0.4s;
}
.film-loader.done { opacity: 0; pointer-events: none; }
.film-loader-dot {
  width: 1px; height: 20px;
  background: var(--ink-ghost);
  animation: fpulse 1.2s ease-in-out infinite;
}
@keyframes fpulse { 0%,100%{opacity:.2;}50%{opacity:.8;} }

/* ── NAV ARROWS ── */
.screen-nav {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  z-index: 20;
  width: 44px; height: 44px;
  border: 1px solid var(--ink-ghost);
  border-radius: 50%;
  background: rgba(6,5,12,.85);
  backdrop-filter: blur(12px);
  color: var(--ink-dim);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .2s, color .2s, opacity .2s;
}
.screen-nav:hover { border-color: var(--accent); color: var(--ink); }
.screen-nav.prev { left: 24px; }
.screen-nav.next { right: 24px; }
.screen-nav:disabled { opacity: .2; pointer-events: none; }

/* ── RESPONSIVE ── */
@media(max-width: 768px) {
  :root { --player-h: 55vh; }
  .page-header, .section-head, .player-label-area, .film-index-section { padding-left: 24px; padding-right: 24px; }
  .film-index-section { margin-top: 24px; }
  .screen-nav.prev { left: 8px; }
  .screen-nav.next { right: 8px; }
  .film-row-cat { display: none; }
}
</style>
</head>
<body>

<header class="page-header">
  <span class="page-label">Design Preview · Commercial CGI · v2</span>
  <span class="page-note">Development branch only — not production</span>
</header>

<section class="section">
  <div class="section-head">
    <h2 class="section-title">Commercial CGI</h2>
    <span class="section-meta">11 films · Product · Brand · Motion</span>
  </div>

  <!-- SCREENING ROOM -->
  <div class="screening-room" id="screeningRoom">
    <div class="film-track" id="filmTrack"></div>
    <button class="screen-nav prev" id="prevFilm" aria-label="Previous film">&#8592;</button>
    <button class="screen-nav next" id="nextFilm" aria-label="Next film">&#8594;</button>
  </div>

  <!-- PLAYER LABEL -->
  <div class="player-label-area">
    <span class="player-film-name" id="playerFilmName">Chocolate</span>
    <span class="player-film-counter" id="playerFilmCounter">01 / 11</span>
  </div>

  <!-- FILM INDEX -->
  <div class="film-index-section" id="filmIndexSection"></div>
</section>

<script type="module">
const CDN = 'https://pub-88341f47988743aba3154d2af5c6327e.r2.dev';
const FILMS_BASE = `${CDN}/gallery/ads/web-ready/`;

const FILMS = [
  {n:'01', name:'Chocolate',                    file:'chocolate.mp4',                              cat:'Product · CGI'},
  {n:'02', name:'Earbuds',                      file:'earbuds.mp4',                                cat:'Product · CGI'},
  {n:'03', name:'Face Wash',                    file:'facewash.mp4',                               cat:'Product · CGI'},
  {n:'04', name:'Pepsi',                        file:'pepsi.mp4',                                  cat:'Brand · Commercial'},
  {n:'05', name:'Serum',                        file:'serum.mp4',                                  cat:'Product · CGI'},
  {n:'06', name:'Shoe',                         file:'shoe.mp4',                                   cat:'Product · CGI'},
  {n:'07', name:'Smart Watch',                  file:'smart-watch.mp4',                            cat:'Product · Tech'},
  {n:'08', name:'911 Commercial',               file:'911%20Commercial.mp4',                       cat:'Automotive · CGI'},
  {n:'09', name:'Moisturizer & Cleanser',       file:'Moisturizer%20and%20Cleanser%20Ad-1.mp4',    cat:'Beauty · CGI'},
  {n:'10', name:'RR Ad',                        file:'RR%20Ad.mp4',                                cat:'Brand · Commercial'},
  {n:'11', name:'Reel',                         file:'Reelvideo-29689.mp4',                        cat:'Showreel · Motion'},
];

let active = 0;
let soundOn = false;
const filmTrack  = document.getElementById('filmTrack');
const prevBtn    = document.getElementById('prevFilm');
const nextBtn    = document.getElementById('nextFilm');
const nameEl     = document.getElementById('playerFilmName');
const counterEl  = document.getElementById('playerFilmCounter');
const indexSection = document.getElementById('filmIndexSection');

function getPlayerW() {
  const room = document.getElementById('screeningRoom');
  return Math.round(room.offsetHeight * 9 / 16);
}
const GAP = 16;

// Build film cards
const filmCards = FILMS.map((film, i) => {
  const card = document.createElement('div');
  card.className = 'film-card' + (i === 0 ? ' active' : '');
  card.dataset.index = i;

  const videoEl = document.createElement('video');
  videoEl.src = `${FILMS_BASE}${film.file}`;
  videoEl.playsInline = true;
  videoEl.muted = true;
  videoEl.loop = true;
  videoEl.preload = 'metadata';
  videoEl.setAttribute('playsinline', '');

  const loader = document.createElement('div');
  loader.className = 'film-loader';
  loader.innerHTML = '<div class="film-loader-dot"></div>';
  videoEl.addEventListener('loadeddata', () => loader.classList.add('done'), {once:true});
  videoEl.addEventListener('error', () => loader.classList.add('done'), {once:true});

  card.innerHTML = `
    <div class="film-num-badge ${i===0?'':'inactive'}">${film.n}</div>
    <div class="player-top">
      <span class="film-cat-badge">${film.cat}</span>
      <span class="film-index-badge">${film.n} / 11</span>
    </div>
    <div class="player-bottom">
      <span class="film-title-player">${film.name}</span>
      <button class="sound-btn" id="sound-btn-${i}">SOUND OFF</button>
    </div>
    <div class="film-card-overlay"></div>
  `;

  card.insertBefore(loader, card.firstChild);
  card.insertBefore(videoEl, card.querySelector('.film-num-badge'));

  // Sound button
  const soundBtn = card.querySelector(`#sound-btn-${i}`);
  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    soundOn = !soundOn;
    filmCards.forEach(({el, video}) => {
      video.muted = !soundOn;
    });
    document.querySelectorAll('.sound-btn').forEach(btn => {
      btn.textContent = soundOn ? 'SOUND ON' : 'SOUND OFF';
      btn.classList.toggle('on', soundOn);
    });
  });

  // Click inactive to select
  card.addEventListener('click', () => {
    if (!card.classList.contains('active')) setActive(i);
  });

  filmTrack.appendChild(card);
  return { el: card, video: videoEl, film };
});

// Film index rows
FILMS.forEach((film, i) => {
  const row = document.createElement('div');
  row.className = 'film-index-row' + (i === 0 ? ' active' : '');
  row.innerHTML = `
    <span class="film-row-num">${film.n}</span>
    <span class="film-row-name">${film.name}</span>
    <span class="film-row-cat">${film.cat}</span>
    <span class="film-row-indicator"></span>
  `;
  row.addEventListener('click', () => setActive(i));
  indexSection.appendChild(row);
});

function setActive(index) {
  active = Math.max(0, Math.min(FILMS.length - 1, index));
  const cardW = getPlayerW();
  const offset = active * (cardW + GAP);

  filmTrack.style.transform = `translateX(calc(-50% - ${offset}px))`;

  filmCards.forEach(({el, video}, i) => {
    const isActive = i === active;
    el.classList.toggle('active', isActive);
    const badge = el.querySelector('.film-num-badge');
    badge.classList.toggle('inactive', !isActive);

    if (isActive) {
      video.play().catch(() => {});
      el.style.opacity = '1';
    } else {
      video.pause();
      const dist = Math.abs(i - active);
      el.style.opacity = dist === 1 ? '0.55' : dist === 2 ? '0.28' : '0.12';
    }
  });

  document.querySelectorAll('.film-index-row').forEach((row, i) => {
    row.classList.toggle('active', i === active);
  });

  nameEl.textContent = FILMS[active].name;
  counterEl.textContent = `${FILMS[active].n} / 11`;
  prevBtn.disabled = active === 0;
  nextBtn.disabled = active === FILMS.length - 1;

  // Scroll index row into view gently
  const rows = indexSection.querySelectorAll('.film-index-row');
  if (rows[active]) {
    rows[active].scrollIntoView({block:'nearest', behavior:'smooth'});
  }
}

prevBtn.addEventListener('click', () => setActive(active - 1));
nextBtn.addEventListener('click', () => setActive(active + 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') setActive(active - 1);
  if (e.key === 'ArrowRight') setActive(active + 1);
});

// Touch swipe
let tsX = 0;
document.getElementById('screeningRoom').addEventListener('touchstart', e => { tsX = e.touches[0].clientX; }, {passive:true});
document.getElementById('screeningRoom').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tsX;
  if (Math.abs(dx) > 50) setActive(active + (dx < 0 ? 1 : -1));
}, {passive:true});

window.addEventListener('resize', () => setActive(active));

setActive(0);
</script>
</body>
</html>
